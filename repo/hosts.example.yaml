# auto-ops-console · 主机清单（**模板** —— 首次使用时把它复制成 hosts.yaml）
#
# ★★ 为什么库里放的是模板而不是真清单：
#   真 `hosts.yaml` 里装的是**某一台管理机所连的那几台机器**（地址 / 账号 / VMware 路径）。
#   它进了公开仓库，别人 clone 下来就会**对着你的内网开跑** —— 所以它**不进 Git**
#   （见 `repo\.gitignore`），而**首次安装脚本**会把这一份复制成 `hosts.yaml` 交给你填。
#
# ★ 用法（三步）：
#   1) 复制：       copy hosts.example.yaml hosts.yaml
#   2) 改下面 3 台：把 id / address / user 换成**你自己的机器**（`port` 默认 22）
#   3) 验一遍：     python -m app.server --check      # 装载自检，会把这 3 台打印出来
#   ★ 没填完也没关系：`--check` 会照常通过，只是**跑动作时会连不上**（那才是如实的结果）。
#
# ── 字段说明 ─────────────────────────────────────────────────────
#   id            这台机在本平台里的**唯一名字**（任务 / 留证 / AI 工具面都靠它索引）
#   name          给人看的名字（界面下拉里显示的就是它）
#   address       IP 或主机名（平台只会 ssh 到它；★ 本平台**不装 agent**，目标机侧零依赖）
#   port          ssh 端口，默认 22
#   user          登录账号（★ 平台**不收密码**：只走密钥认证，见 `auth: key`）
#   auth          固定 `key`（本平台只支持密钥；`host.enroll` 会帮你把公钥铺过去）
#   identity_file 私钥路径（`~` 会被展开）
#   role          这台机**是干什么的**（`lab` / `k8s-control-plane` / `k8s-worker` /
#                 `docker-registry` / `db` / `web` …）—— 只影响界面分组与配方选机
#   tags          自由标签，给人看
#   vm            可选：这台机对应的虚拟机的**归属登记**（见下）
#   note          自由备注（体检 / 报告里会带上）
#
# ── ★★ 关于 `vm:` 段（用 VMware Workstation 时才需要）──────────────
#   本平台能在**宿主机**上开关虚拟机（`vm.start` / `vm.stop` / 快照…，不走 ssh）。
#   ★ 但"哪台 VM 归本项目管"**只有一个来源**：就是这里的 `vm:` 段。
#     没登记的虚拟机**只读可见、不可操作** —— 这是**故意的**：
#     宿主机上通常还有别的、与本项目无关的机器，不许被顺手关掉。
#   ★★ 不许靠"id == 目录名"的巧合：下面第 3 台就是**故意**取了个不同名的 vm 路径，
#      它是本项目的实测证据（规范 §12.116）—— 靠巧合的代码今天能跑，下一台就会打脸。
#   ★ 确实要临时操作一台没登记的机器 ⇒ 把它写进 `config.yaml` 的 `vm.extra_allow`
#     （**当次点名，写进文件即留痕**），★ **用完记得收回**。

hosts:
  # ── 1) 一台普通 Linux 靶子机（最常用：拿它练部署 / 体检 / 排障）──
  - id: node-01
    name: node-01（练手用的靶子机）
    address: 192.0.2.101
    port: 22
    user: root
    auth: key
    identity_file: ~/.ssh/id_ed25519
    role: lab
    tags: [lab, 随便动]
    note: >
      ★ 这一台是**你的实验对象**：部署 / 卸载 / 改配置这类变更动作，建议都先落在它身上。
      平台不认识"哪些是自造的东西"，所以习惯上把自建的 unit / 目录 / 配置文件加上统一前缀
      （本项目用 `aoc-`），这样收尾时能一眼看出"哪些是我造的"。

  # ── 2) 一台跑着正经业务的机器（只读观察）──
  - id: prod-like-01
    name: prod-like-01（跑着东西，只读观察）
    address: 192.0.2.102
    port: 22
    user: root
    auth: key
    identity_file: ~/.ssh/id_ed25519
    role: web
    tags: [只读观察, 谨慎变更]
    note: >
      ★ 拿它练"**我只想看，不想改**"：平台的动作分三档（只读 / 可恢复 / 破坏性），
      只读动作随便跑；可恢复与破坏性动作**有人点头才动**（界面里要手输确认词）。
      ★ 习惯做法：**没有授权就不要在这台上做变更动作** —— 平台会把这件事记在任务留证里。

  # ── 3) 一台由本机（宿主机）托管的虚拟机 + 归属登记 ──
  - id: vm-01
    name: vm-01（本机 VMware 里的一台）
    address: 192.0.2.103
    port: 22
    user: root
    auth: key
    identity_file: ~/.ssh/id_ed25519
    role: lab
    tags: [VMware, 可开关机]
    # ★★ 这个 `vm:` 段是「哪些 VM 归本项目管」的**唯一来源**（规范 §12.116）。
    #    ★ vmx 必须是**宿主机上的绝对路径**；且必须落在 `config.yaml` 的
    #      `vm.allow_vmx_dirs` 白名单目录里（纵深防御：名字写对了、出了白名单也拒）。
    #    ★★ 注意这里 id（`vm-01`）与 vmx 文件名（`my-test-vm`）**故意不同名** ——
    #       平台**不靠名字猜**，只认这一段。
    vm:
      provider: vmware-workstation
      vmx: C:\vmware-vms\my-test-vm\my-test-vm.vmx
    note: >
      这一台可以用 `vm.start` / `vm.stop` / `vm.snapshot-*` 开关机与打快照。
      ★ 判据是**问 VMware 自己**（`vmrun list`），不是"命令返回 0"。
      ★ 开机是**有人点头才做**的动作（它会占宿主机的 CPU / 内存 / 磁盘 IO）。
