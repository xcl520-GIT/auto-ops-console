    label: K8s 集群引导（七只手：reset / init / kubeconfig / join / nodes / apply / wait + ★★ 幂等守卫）
    since: T8
    done: true
    risk: red
    status: 已具备（T8·S6+S7 · **真机端到端 + 正反例都跑过**）· ★★ **本项目第一次把手伸到"改错了会锁住自己"的地方**（内核参数 / 容器运行时 / 集群引导），所以三条口径是本条目的本体：① ★★ **引导类的"成功"必须是终态**（规范 §12.32.2）—— `kubeadm init` 失败会**留下半个集群**，判据一律换成**退出码 / 条数**（清单条数 · `cmp` · `/livez` · `wait --for=condition=Ready`），**没有一条**是"命令返回 0"；实测：`kubeadm init` 后 `kubectl get --raw /livez` 为 0、三节点 `kubectl wait --for=condition=Ready nodes --all` 为 0。② ★★ **幂等守卫（§12.33）**："预检**不成立** = **已达终态**" —— 一次性引导动作的预检问的正是"目标是不是还没做成"，第二次跑必然不成立；按老规矩它会**中止整条配方** ⇒「再点一次」永远做不到。★★ 守卫**挂在步骤上、不挂在动作上**（一个动作的多条预检语义不同：「有没有旧集群」可以是终态判据，「`kubeadm` 在不在」**永远不是**），三条装载期硬校验 + 报告里念出理由。实测：控制面与工作节点**两侧**复跑都判「跳过」、`changed` 为空、`RESTARTS` 不增。③ ★★ **"是不是我们建的"必须有一个落点**（§12.32.4）—— `kubeadm reset` 不可逆，放进"一键"里就必须能自动回答"这个集群该不该被拆"，而那不是能靠观测回答的问题（**旧集群在本话题开工时是活着的、Ready 的**）；判据是**所有权标记** `/etc/kubernetes/aoc-owned.json`（init/join 成功后写、reset 会一起删掉）。★ 代价如实写：不是我们建的**活**集群会被当成"旧集群"拆掉 ⇒ 它保持 `red` + **禁止批量**。★★ 另抓到并修掉**两条真缺陷**：`ok_exit_codes` 因判定里带了"0 永远算成功"而**表达不了"这条命令必须失败"**（六个老动作一直在**假绿**，规范 §12.36）；大文件走内联命令行撞 Windows `CreateProcess` 上限（238KB 的 Calico 清单 ⇒ `WinError 206`，规范 §12.35 改走 scp + 原子 `mv`）

