# auto-ops-console · 覆盖地图账本
#
# 设计口径（来自 设计\03-Linux运维命令覆盖地图.md §2.2「地图即账本」）：
#   本文件登记「应该有什么」；catalog/actions/*.yaml 是「已经有什么」。
#   程序启动时自动对账，算出每一层/每一域/每个优先级/每个风险等级的实现率与缺口清单。
#
# ★ 对账只看 id 是否存在（app/catalog.py 的 reconcile）：
#     登记项 id 与某个动作文件同名 → 计为"已实现"，否则进"缺口清单"。
#   因此：**能实现成一个动作的，才登记进 entries**；
#   不是动作的平台能力（执行历史与回放、改动前自动备份）放到文件末尾的 platform: 段，
#   避免污染覆盖率分母（与 demos: 同一个思路）。
#
# 字段说明：
#   id / domain / label / commands / risk / priority  —— 参与对账与界面展示
#   stage   —— 计划在哪个话题做（T1/T2 已做，T3/T4 待做）
#   status  —— **人类可读的说明，不参与对账**（写清"没做的为什么没做"）
#
# 备注：域 G 的「登录审计」条目由域 B 的 host.logins 一并覆盖（同一份数据、同一个动作），
#       为免把同一个动作算两遍，这里只在域 B 登记一次。
#
# T2 阶段说明：
#   T2 已完成 P0 只读条目的铺量（23 个只读动作），本文件同时补登记了 T1 遗留的 P1 项
#   与后续话题（T3/T4）的条目，让"缺口"一眼可见。

version: 2
updated: 2026-09-27
# ★★ T10·S9：页首时点对账（口径见下面的"时点对账"注释块）。
#   本次从 T9 推到 T10 —— 与 `stage_scope` 一起改，**两处必须同步**（T7 收尾时立过的规矩）。
#   ★ T10 的四处回填：① `entries` 段 —— **不动**（52 条全部已实现，无新增项）；
#     ② `platform` 段 —— 新增 **1 条**（`monitoring-stack`）；
#     ③ `weights` —— 新增 **1 条**（w=5，`src: infer`，`why` 写出三处点名出处）；
#     ④ 页首时点对账 —— `stage_scope` 由 **T9 → T10**，`updated` → 2026-09-27。
#   ★★ 口径提醒（与 T8/T9 同）：**分母不变不代表没干活** —— T10 交付的是 10 个 `mon.*` 动作
#     ＋ 两份配方（`monitoring-stack` / `monitoring-agent`）＋ 五个配置模板目录 ＋ 一张界面页签，
#     全部属于"接入监控告警"这一类能力 ⇒ **按 §10.2 #3 拍板记 1 条**（判据是"**用户能不能不看终端
#     做完一件事**"：接入监控告警**是一件**，从"机器上什么都没有"到"能收到告警"）。
#     ⇒ **条数口径的分母纹丝不动（仍是 52）**；两个口径各自在回答不同的问题。
#   ★ 记账口径为什么是 1 条而不是 3 条（三件套）：拆成三条会让"装了一半"与"装完了"看起来一样。
# ★★ T16·S3：页首时点对账（口径见下面的"时点对账"注释块）。
#   本次从 **T10 直接推到 T16** —— ★ 实话实说：**中间几站（T11~T15）没有改动本文件**
#   （它们交付的是交付包 / 文档 / AI 助手面，没有新增"能力条目"）。
#   ★ T16 的四处回填：① `domains` —— **新增 `M: 虚拟化与快照`**
#     （★ 必需：动作的 domain 必须能在账本里找到，vm.* 的 domain 就是 M）；
#     ② `entries` 段 —— **不动**（那 52 条是"Linux 运维命令覆盖地图"的口径，
#        ★ 虚拟化层不属于那张地图 —— 与 T8 的 `k8s.*` 同一口径处理）；
#     ③ `platform` 段 —— 新增 **2 条**（`vm-lifecycle` / `vm-snapshot-guard`）；
#     ④ `weights` —— 新增 **2 条**（各 w=5，`src: infer`，`why` 写出点名出处）。
#   ★★ 为什么是 2 条而不是 10 条（10 个动作）：判据仍是"**用户能不能不看终端做完一件事**" ——
#     「让一台关机的靶子机开起来、干完事、关回去」是**一件事**；
#     「变更前打快照」是**另一件事**（护栏，与文件级备份并列）。
#     ★ 拆成 10 条会让"动作铺得多"冒充"事情做得成"——那正是覆盖率最该防的假象（T10 同源）。
#   ★ 分母怎么变的：**条数口径的分母纹丝不动（仍 52）**；加权口径 +10（两条 w=5）；
#     platform 段 18 → 20。★ **不靠改口径凑数**（T7 立的规矩：分母也要钉住）。
stage_scope: T16

domains:
  A: 系统与主机
  B: 用户与权限
  C: 文件与目录
  D: 磁盘与存储
  E: 进程与服务
  F: 网络
  G: 安全面
  H: 包管理
  I: 性能与排障
  J: 容器基础
  K: 批量与自动化
  L: 备份与恢复
  # ★★ T16（六·虚拟化层）：宿主机与 VM 生命周期。★ 它**不是**"Linux 运维命令"那一类 ——
  #    它的动作执行在**宿主机**上（本机 vmrun.exe，不走 ssh，规范 §12.115），
  #    管的是"机器的开关"（电源 / 快照 / 就绪），所以单独立一个域。
  M: 虚拟化与快照

# 风险等级说明（与 YAML 中 risk 字段一致）
risk_levels:
  green: 只读，不改动目标机
  yellow: 可恢复的变更，执行前需二次确认
  red: 破坏性，执行前需二次确认 + 影响面提示

entries:
  # ================= 域 A · 系统与主机 =================
  - id: host.overview
    domain: A
    label: 主机概览卡片（一屏给全）
    commands: ["hostnamectl", "uname -r", "cat /etc/os-release", "uptime", "lscpu", "free -h"]
    risk: green
    priority: P0
    stage: T1
    status: 已实现

  - id: host.datetime
    domain: A
    label: 时间与时区（含同步状态红灯提示）
    commands: ["timedatectl", "chronyc tracking", "chronyc sources"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现（三重交叉验证：timedatectl / sestatus 式属性 + /etc/localtime 链接）

  - id: host.kernelparams
    domain: A
    label: 内核参数与模块查看
    commands: ["sysctl -n", "lsmod"]
    risk: green
    priority: P1
    stage: T3
    status: 已实现（T7·S7）：★★ **这是一笔从 T2 起就挂着的账**（T2 的 20 项清单里没有它，开题单 §2.3 列为缓冲项，一直顺延）。① 参数用 `sysctl <键>…`（**不加 `-a`**，只取要判读的那几个）⇒ 输出是 `KEY = VALUE`，走 `shell_kv`，再用 `pick` 把带点的键名改成短名字（★ 结论模板的 `{core.ip_forward}` 是"点号取字段"，键名再带点必歧义）；② **参数总条数**走 `sysctl -a` + `line_count`（动作层禁止管道 ⇒ `| wc -l` 写不了，"数行数"只能由解析器做）；③ ★ **模块计数**走 `/proc/modules`（一行一个、**没有表头**）、**显示**走 `lsmod`（给人看的形态）—— 这样"数行数"拿到的才是精确条数。真跑对照：node-03 = **1087 条参数 / 77 个模块**（nfsd/sunrpc/rpcrdma 那几个是 NFS 配方的痕迹）；docker-01 = **2456 条 / 79 个**（veth/bridge/nf_nat/xt_MASQUERADE —— 容器网络那一套）。同一份代码在同一屏里给出这两台"被谁调过"的差别，正是"一次给全结论"要的效果

  # ================= 域 B · 用户与权限 =================
  - id: host.logins
    domain: B
    label: 登录情况与用户画像（含失败登录识别）
    commands: ["who", "w", "last", "lastb", "lastlog", "loginctl"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现 —— 同时覆盖域 G 的「登录审计」条目（不重复登记）

  # ================= 域 C · 文件与目录 =================
  - id: disk.usage
    domain: C
    label: 磁盘用量总览（df + inode）
    commands: ["df -P", "df -P -i"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现

  - id: disk.topdir
    domain: C
    label: 目录体积排行
    commands: ["du -x -m --max-depth", "du --threshold"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现（排序在解析器内做，见规范 v1.1 §8.1）

  - id: disk.bigfiles
    domain: C
    label: 大文件查找
    commands: ["find -xdev -type f -size", "find -printf"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现

  - id: file.grep
    domain: C
    label: 文件内容检索（关键字 + 上下文 + 高亮）
    commands: ["grep -n -C", "tail", "head"]
    risk: green
    priority: P0
    stage: T3
    status: 未做 —— P0 只读条目，但不在用户确认的 T2 清单内（记入 T2 的动作清单勾选表）

  # ================= 域 D · 磁盘与存储 =================
  - id: block.overview
    domain: D
    label: 磁盘与分区总览
    commands: ["lsblk -J", "blkid", "df"]
    risk: green
    priority: P0
    stage: T3
    status: 未做 —— T2 缓冲项（开题单 §2.3），信息展示价值低于诊断类，顺延

  # ================= 域 E · 进程与服务 =================
  - id: svc.list
    domain: E
    label: 服务总览（谁在跑 / 谁失败 / 失败原因）
    commands: ["systemctl status", "systemctl is-failed", "systemctl list-units"]
    risk: green
    priority: P0
    stage: T1
    status: 已实现

  - id: log.view
    domain: E
    label: 日志查看器（unit / 时间范围 / 级别 / 关键字）
    commands: ["journalctl -u", "journalctl --since", "journalctl -p"]
    risk: green
    priority: P0
    stage: T1
    status: 已实现（结论是否收窄 → T1 遗留 #8，顺延 T3/T4 讨论）

  - id: proc.overview
    domain: E
    label: 进程总览（CPU/内存排序、进程树、按用户/名称过滤）
    commands: ["ps --sort", "pgrep -a", "pstree -p", "/proc/loadavg", "nproc"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现（TOP 20 由 head_lines 截断，条数不可调，见规范 v1.1 §8.6）

  - id: timer.list
    domain: E
    label: 定时任务查看（crontab + systemd timer，可读化）
    commands: ["crontab -l", "systemctl list-timers", "systemctl list-units --type=timer"]
    risk: green
    priority: P1
    stage: T2
    status: 已实现（只读；增删属 T3）

  # ↓ T3（2026-09-25）：原来的单一入口 svc.control 拆成 5 个动作。
  #   拆分的理由（不是洁癖）：**风险分级是动作级静态字段**，而"启动"与"停止"的风险
  #   差着一个数量级（停止不可 undo），自证期望也相反（is-active 期望 0 / 3）。
  #   合成一个动作就只能取最保守的分级与最弱的自证 —— 那才是真正的偷懒。
  - id: svc.start
    domain: E
    label: 启动服务（自证 ActiveState=active）
    commands: ["systemctl start", "systemctl is-active", "systemctl show -p ActiveEnterTimestamp"]
    risk: yellow
    priority: P0
    stage: T3
    status: 已实现（T3 · 2026-09-25，真跑验证：aoc-lab.service）

  - id: svc.stop
    domain: E
    label: 停止服务（red：不可 undo，须手输确认词）
    commands: ["systemctl stop", "systemctl is-active"]
    risk: red
    priority: P0
    stage: T3
    status: 已实现（T3 · 真跑 + 正面/反面确认词验证）

  - id: svc.restart
    domain: E
    label: 重启服务（用启停时间戳自证"真的重启了"）
    commands: ["systemctl restart", "systemctl is-active", "systemctl show -p ActiveEnterTimestamp"]
    risk: yellow
    priority: P0
    stage: T3
    status: 已实现（T3 · 真跑验证：PID 与时间戳均变化）

  - id: svc.enable
    domain: E
    label: 设置服务开机自启
    commands: ["systemctl enable", "systemctl is-enabled", "systemctl show -p UnitFileState"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（T3 · 装载校验通过；真跑留待与 enable/disable 配对演练）

  - id: svc.disable
    domain: E
    label: 取消服务开机自启
    commands: ["systemctl disable", "systemctl is-enabled"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（T3 · 退出码期望与 enable 相反：is-enabled 只接受 1）

  - id: cron.upsert
    domain: E
    label: 新增/更新定时任务（只写 /etc/cron.d/aoc-*，不碰 crontab）
    commands: ["写 /etc/cron.d/aoc-<名字>", "cat 读回"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（T3 · 真跑验证 + 触发改动前自动备份）

  - id: cron.remove
    domain: E
    label: 删除定时任务（参数白名单锁死在被管理文件上）
    commands: ["rm -f /etc/cron.d/aoc-<名字>", "ls 确认已消失"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（T3 · 真跑验证：备份 → 删除 → 恢复演练闭环）

  # ================= 域 F · 网络 =================
  - id: net.addr
    domain: F
    label: 网卡与地址总览
    commands: ["ip -j addr", "ip -j route show default", "nmcli device show"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现

  - id: net.route
    domain: F
    label: 路由表与邻居（ARP）表
    commands: ["ip -j route", "ip -j neigh", "ip -j rule"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现

  - id: net.dns
    domain: F
    label: DNS 解析链路诊断
    commands: ["cat /etc/resolv.conf", "getent hosts", "getent ahosts"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现 —— RHEL 10 无 dig/nslookup，改走 glibc 解析链路（getent）

  - id: net.ping
    domain: F
    label: 连通性与路径诊断
    commands: ["ping -c -W", "traceroute -n"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现 —— traceroute 缺失时给 TOOL_MISSING（原因 + 安装建议）

  - id: net.port
    domain: F
    label: 端口占用查询（端口 → 进程 → 归属服务）
    commands: ["ss -H -tulnp", "ps -o unit= -p"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现（foreach 反查归属 systemd 单元）

  - id: net.http
    domain: F
    label: HTTP 探测（响应码 / 耗时 / TLS）
    commands: ["curl -w", "curl -I"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现

  - id: net.firewall
    domain: F
    label: 防火墙规则查看
    commands: ["firewall-cmd --list-all", "firewall-cmd --permanent --list-all"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现 —— 特意对比"运行时 vs 持久化"，暴露"改了没 --permanent"

  # ================= 域 G · 安全面 =================
  - id: sec.selinux
    domain: G
    label: SELinux 状态
    commands: ["getenforce", "sestatus", "cat /etc/selinux/config"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现（三重交叉验证，暴露"改了没生效"）

  - id: sec.avc
    domain: G
    label: 近期 AVC 拒绝记录
    commands: ["ausearch -m avc -ts --input"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现 —— 需显式 --input + 传输层关 stdin，见规范 v1.1 §8.5

  - id: sec.cert
    domain: G
    label: 证书到期检查
    commands: ["openssl x509 -enddate", "openssl x509 -checkend"]
    risk: green
    priority: P1
    stage: T2
    status: 已实现（用 -checkend 让 openssl 自己判 30 天 / 7 天）

  - id: sec.ssh-harden
    domain: G
    label: SSH 加固与密钥管理查看
    commands: ["sshd -T", "ls authorized_keys", "ssh-keygen -l -f"]
    risk: green
    priority: P1
    stage: T3
    status: 已实现（T7·S7）：★ 判加固取**最终生效值**（`sshd -T` = OpenSSH 默认值 + `Include` 进来的文件合并后的结果），不是"配置文件里写没写"—— 与规范 §12.13.5「找服务自己留的钩子」同一个道理，只是这次站在**只读侧**：判"生效了什么"要用服务自己的入口，别去猜它读了哪些文件。★ 为它的输出（**指令名 值**，空格分隔）新增解析器 **`space_kv`**（规范 §12.23）—— §5 的三条判定同时成立才加的。★ 公钥只给**数量 + 指纹 + 注释**，**不打印公钥本身**；权限也看（`600` + root 是期望值）。★★ **真跑核到一条环境事实**：RHEL 10 的 `sshd -T`（104 行）**不打印 `challengeresponseauthentication`**（已是 `kbdinteractiveauthentication` 的别名）⇒ 本动作**不再取它**（取一个永远取不到的键只会多一个假「（无）」）。真跑：node-03 与 docker-01 两台一致 —— `PermitRootLogin=yes` / `PasswordAuthentication=yes` / `X11Forwarding=yes` / `MaxAuthTries=6` / `LoginGraceTime=120` / **`ClientAliveInterval=0`（没开保活）**；root 授权公钥 **2 把**，其中 `SHA256:qJoghe9Y80S19NtbuVAoa0eskzNXBiCwGNJB4N6Xbp4` 与 `hosts.yaml` 里记的纳管公钥指纹**逐字相同**（= 这套动作能验"钥匙是不是当时那把"）

  # ================= 域 H · 包管理 =================
  - id: pkg.installed
    domain: H
    label: 已装软件与文件归属
    commands: ["rpm -qa", "rpm -qi", "rpm -qf", "rpm -ql"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现

  - id: pkg.search
    domain: H
    label: 包搜索 / 哪个包提供这个命令
    commands: ["dnf search", "dnf provides", "rpm -q"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现（含"常用诊断工具装了没"的盘点）

  # ================= 域 I · 性能与排障 =================
  - id: kernel.log
    domain: I
    label: 内核日志与 OOM 检索
    commands: ["dmesg -T --level", "journalctl -k -g oom", "journalctl -p err -b"]
    risk: green
    priority: P0
    stage: T2
    status: 已实现

  - id: perf.overview
    domain: I
    label: 负载与资源概览（CPU/内存/IO/负载 一屏）
    commands: ["uptime", "vmstat", "mpstat", "pidstat"]
    risk: green
    priority: P0
    stage: T3
    status: 未做 —— T2 缓冲项（开题单 §2.3），顺延

  # ================= 域 J · 容器基础 =================
  - id: container.overview
    domain: J
    label: 容器/镜像/卷/网络总览（docker/podman）
    commands: ["docker ps", "podman ps", "images", "volume ls"]
    risk: green
    priority: P1
    stage: T6
    status: 已具备（T6 · 真机跑过）· ★ 拍板原文是"只做**查看现状**、不加配方，用 docker-01 做只读观察对象"（开题单 §10.2 #3）—— 本动作就是那个"查看现状"：引擎版本 + 容器（含已停止）+ 镜像 + 卷 + 网络一屏给全。两个引擎同一个动作（`run_by` 选段：`docker …` / `podman …`）。★ 没有引擎时**预检不通过、明确说清**，不硬造"ok 但内容为空"（§10.6.3「空结果 ≠ 空数据」）

  # ================= 域 K · 批量与自动化 =================
  # ★ T3 说明：批量执行**不是"一个动作"**，而是平台能力 —— 所以不登记在这里占覆盖率分母，
  #   改登记在文件末尾的 platform: 段（id: batch-exec）。同一个理由适用于域 L 的备份/恢复。

  # ================= 域 L · 备份与恢复 =================
  # ★ T3 说明：改动前自动备份与备份恢复同样是平台能力，见 platform: 段的
  #   file-backup-before-change / backup-restore。

  # ★ T4 修正：原登记 id 是裸 `checkup`（domain L），而规范 §1 要求 id 形如 `域.动作名` ——
  #   按原名永远无法被实现（文件名不可能同时等于 id 又合规）。T4 正名为 host.checkup，
  #   归入域 A（体检回答的是"这台机器现在好不好"，属系统与主机）。
  - id: host.checkup
    domain: A
    label: 一键体检（把只读项打包成结论式报告）
    commands: ["（编排上面若干只读动作）"]
    risk: green
    priority: P0
    stage: T4
    status: 已实现（T4 · 采集走 catalog/actions/host.checkup.yaml，判定走 app/checkup.py，规范 §10.2）

  # ================= T3 新增：变更类动作（2026-09-25） =================
  - id: fw.port-open
    domain: F
    label: 防火墙放行端口（永久/仅运行时，自证 runtime 生效）
    commands: ["firewall-cmd --add-port", "firewall-cmd --query-port", "firewall-cmd --reload"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（装载校验通过）。★ 真机验证受限：本工作台 4 台靶机的 firewalld 均为 inactive，已在预检给出可操作建议（252 → SERVICE_NOT_RUNNING）；"真放行"验证需要一台 firewalld 运行中的机器

  - id: fw.port-close
    domain: F
    label: 防火墙撤销端口放行（自证 query 返回 1）
    commands: ["firewall-cmd --remove-port", "firewall-cmd --query-port"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（装载校验通过）；真机验证受 firewalld 未运行限制，同上

  - id: pkg.install
    domain: H
    label: 安装软件包（装完 rpm -q 自证，并给出可回退的事务号）
    commands: ["dnf install -y", "rpm -q", "dnf history"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（装载校验通过；单步 timeout 放宽到 300s —— dnf 是最慢的一类动作）

  - id: pkg.update
    domain: H
    label: 更新指定软件包（刻意不做全量更新）
    commands: ["dnf update -y", "rpm -q", "dnf history"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（只更新指定包；全量 dnf update 刻意不提供 —— 那等于一次性释放所有风险）

  - id: pkg.remove
    domain: H
    label: 卸载软件包（red：先列出依赖它的包，再动手）
    commands: ["rpm -q --whatrequires", "dnf remove -y", "rpm -q"]
    risk: red
    priority: P1
    stage: T3
    status: 已实现（装载校验通过）

  - id: file.push
    domain: C
    label: 上传文件到目标机（覆盖前自动备份 + sha256 双向校验）
    commands: ["scp 上传", "sha256sum", "stat"]
    risk: yellow
    priority: P1
    stage: T3
    status: 已实现（真跑验证：覆盖靶子配置，自动备份 115B 旧文件，上传后管理机/目标机指纹双向一致）

  - id: file.pull
    domain: C
    label: 从目标机取回文件（取证 / 对比 / 留档）
    commands: ["stat", "scp 下载"]
    risk: green
    priority: P1
    stage: T3
    status: 已实现（装载校验通过）

  # ================= T5 新增：配方引擎缺的那两只手（2026-09-25） =================
  # ★ 它们不是覆盖率地图原本登记过的条目 —— 是 T5 做配方时发现**真的缺**的能力：
  #   开题单 §3.6 先立项 → 规范 §12.8 补约定 → 最后才写 YAML（先规范后代码）。
  - id: svc.configtest
    domain: E
    label: 配置语法校验（nginx -t / sshd -t，只校验、不改状态）
    commands: ["/usr/sbin/<binary> -t"]
    risk: green
    priority: P1
    stage: T5
    status: 已实现（T5 · 真机真跑正反例）：装着好配置 → 通过；被 file.push 写坏 → 判失败并带上远端原文（unknown directive …）；机器上没这个程序 → 预检拦下、给"先确认这个服务装没装"的建议。★ 命令是**枚举**（只允许 nginx / sshd），不接受任意命令 —— 安全契约 §4 的落点

  - id: file.remove
    domain: C
    label: 受限删除（路径白名单 · red · 禁止批量）
    commands: ["ls -ld（确认存在）", "du -sh", "rm -rf", "ls -ld（退出码 2 自证已删）"]
    risk: red
    priority: P1
    stage: T5
    status: 已实现（T5 · 真机真跑 + 10 条越界负例）：配方「卸载·全删」缺的那只手。四道锁：① red（手输确认词）② 路径白名单（只允许 /etc|/var/lib|/var/log|/opt|/var/www 下的 <名>，且每段不得以点开头 → `/`、`/etc`、任何位置的 `..` 在**参数校验阶段**就被拒）③ 禁止批量 ④ 改动前自动备份。负例见 证据\T5-file.remove越界负例-*.md

  # ================= T6 新增：`responds` 判据的三个探活动作（2026-09-26） =================
  # ★ 它们不是覆盖率地图原本登记过的条目 —— 是 T6 做服务铺量时发现**真的缺**的能力：
  #   开题单 §3.3 先立项 → 规范 v1.7 §12.11 补约定（"命令类判据"）→ 最后才写 YAML（先规范后代码）。
  #   验收口径：≥2 个服务能"真问一句它活着吗"，而不是只看"单元在跑 / 端口在听"那种旁证。
  #   ★ 三个都是 green（只读）：`changed` 恒 false（规范 §12.3），不参与幂等验收的"变更"一侧。
  - id: db.mariadb-ping
    domain: E
    label: MariaDB 探活（真问一句它活着吗：mariadb-admin ping）
    commands: ["mariadb-admin ping（本机 socket + unix_socket 认证，不需要密码）"]
    risk: green
    priority: P1
    stage: T6
    status: 已实现（T6·S1）：`expect.responds` 的采集来源之一（规范 §12.11.3）。★ 命令形态以**真机实测**为准（T6·S2 确认；走 TCP 会撞"root 不许无密码远程登录"，那是认证问题、不是服务问题）

  - id: db.valkey-ping
    domain: E
    label: Valkey 探活（真问一句它活着吗：valkey-cli PING → PONG）
    commands: ["valkey-cli -h 127.0.0.1 -p <port> PING"]
    risk: green
    priority: P1
    stage: T6
    status: 已实现（T6·S1）：★ Rocky/RHEL 10 是 Valkey 取代 Redis，实测**没有** `redis-cli` 兼容名（写错就是 rc=127）。命令与端口以真机实测为准（T6·S3 确认）

  - id: nfs.export-check
    domain: F
    label: NFS 导出清单（问本机 mountd：导出到底生效了没有）
    commands: ["showmount -e 127.0.0.1"]
    risk: green
    priority: P1
    stage: T6
    status: 已实现（T6·S1）：判"写了 /etc/exports.d 但没生效"这一类假成功。★ 空输出（什么都没导出）→ 动作 verify 判红 → 期望判 fail（服务在跑但没导出，本来就不该算健康）

  # ================= T7 新增：升级与回退缺的三只眼睛/手（2026-09-26） =================
  # ★ 同样不是覆盖率地图原本登记过的条目 —— 是 T7 做「服务治理」时发现**真的缺**的能力：
  #   开题单 §3.2 / §3.3 / §3.7 先立项 → 规范 v1.8 §12.15 / §12.16 补约定 → 最后才写 YAML。
  - id: pkg.outdated
    domain: H
    label: 可升级清单（升级预检：哪些包装了版本可升）
    commands: ["dnf repolist", "dnf check-update"]
    risk: green
    priority: P1
    stage: T7
    status: 已实现（T7·S1 · 真跑三台）：★★ **退出码语义是本条目的核心** —— `dnf check-update` 的 **100 = 有更新、0 = 无更新**，★ **100 不是失败**（与 `pkg.search` 里 `rpm -q` 的"rc = 缺几个包"同族）：**命令的退出码不是错误码，是它的一句话结论**（规范 §12.15.2）。★ **源不可达 ⇒ 判"无法判定"，绝不判"没有可升级的"**：docker-01 的 BaseOS 源失效（指向已不存在的 ISO）**当场成为这条规矩的反例**（如实失败 + 否定横幅）；node-02/node02 实测有大量可升级包（kernel 6.12.0-211.58.1 / docker-ce 3:29.8.1 / kubeadm·kubectl·kubelet 1.34.12 等）

  - id: pkg.rollback
    domain: H
    label: 按事务号回退软件包变更（把"承诺的回退"变成能执行的动作）
    commands: ["dnf history", "rpm -q", "dnf history undo <事务号>"]
    risk: red
    priority: P1
    stage: T7
    status: 已实现（T7·S1）：★★ **它补的是一笔欠账**：`pkg.install` / `pkg.update` / `pkg.remove` 的结论模板一直在承诺"回退：`dnf history undo <事务号>`"，**而全库 48 个动作里没有任何一个能做它** ⇒ 我们承诺了一条"得让人自己 ssh 上去敲"的回退路径（检查清单 47 同族：**承诺兑现不了比不承诺更坏**）。规矩：**列事务（只读）→ 回退 → 自证**；事务号必须来自"先看历史"那一步、**不许凭记忆填**；★ **自证是"版本回到变更前"（rpm -q 逐字对照），不是"命令返回 0"**；🔴 手输确认词 + 禁止批量（规范 §12.15.3）

  - id: file.stat
    domain: C
    label: 路径状态（它在不在：ls -ld，退出码 2 = 不存在）
    commands: ["ls -ld（0=在 / 2=不在）", "du -sh"]
    risk: green
    priority: P1
    stage: T7
    status: 已实现（T7·S1）：★ 补的是**全删收敛检查的路径那一半**（规范 §12.16 规矩 3）—— 在此之前没有任何只读动作能回答"这个目录还在不在"，于是"配置/数据目录真的删掉了吗"只能看删除命令是否返回 0（**假绿**）。它同时是 `expect.absent` 的存在性来源之一（`PRESENCE_SOURCES`），**参数白名单与 `file.remove` 逐字相同**：删得掉的路径一定查得着，收敛检查没有盲区。★ 与 `pkg.outdated` 同一个坑：**rc=2 是结论不是错误**（`ok_exit_codes=[0,2]`）

# ------------------------------------------------------------------ 非动作能力
#
# 与 demos: 同一个思路：**不是"一个动作"的能力**单独登记，避免污染覆盖率分母。
platform:
  # ★ T4 新增字段 done（显式布尔，规范 §10.3.4）：
  #   entries 段的完成度由"动作文件是否存在"自动判定；platform 段没有动作文件可比，
  #   所以必须给一个**结构化**字段 —— 不能靠中文 status 文本里有没有"已具备"来匹配（那太脆）。
  - id: task-replay
    label: 执行历史与回放（每条命令原文 / 输出 / 退出码可查可复现）
    since: T1
    done: true
    status: 已具备（平台能力，不是动作）—— 见界面「历史」页与 var/ops.db

  - id: file-backup-before-change
    label: 关键文件"改动前自动备份"（目标机 + 管理机双份，含 sha256）
    since: T3
    done: true
    risk: yellow
    status: 已具备（T3 · 真跑验证）：动作声明 backup 段 → 引擎在**任何变更步骤之前**备份；备份失败即中止动作；两侧落点 /var/backups/aoc/<任务ID>/ 与 repo/var/backups/<任务ID>/ —— 见 docs/动作规范.md §9.1

  - id: backup-restore
    label: 备份恢复（一键回到变更前，恢复后逐字节自证）
    since: T3
    done: true
    risk: red
    status: 已具备（T3 · 恢复演练通过）：需手输确认词「确认恢复」；恢复后 sha256 与备份逐字节比对 —— 规范 §9.2。★ 明确**不做自动回滚**：自动还原可能把"其实没坏"的现场也覆盖掉

  - id: batch-exec
    label: 多机批量执行 + 横向对比（失败隔离）
    since: T3
    done: true
    risk: yellow
    status: 已具备（T3 · 真跑验证）：4 台同参数 4/4 成功；制造差异后 3 成功 + 1 中止（失败隔离成立）；**red 动作禁止批量**是硬规矩（不提供配置开关）；横向对比按"任务状态 + 自证结果"判定 —— 规范 §9.3

  - id: host-enroll
    label: 主机纳管（填 IP/账号 → 自动铺公钥、验证、登记、体检）
    since: T4
    done: true
    risk: yellow
    status: 已具备（T4 · 正反例都真跑过）：★ 由用户在 T3 期间提出的真实痛点（原话："以后为了用你这个平台工具，还要自己去改公钥，不是本末倒置吗"）。T4 走零依赖路径 A（一次性内网分发点：绑管理机内网 IP + 随机路径 + 一次性 token + 用完即停 + 120s 兜底），6 步全过 —— 预检 / 发公钥 / **真登录校验**（hostname=docker-01）/ 关停分发点 / 写 hosts.yaml（写前备份）/ 自动体检 4281ms，规范 §10.1；反例（坏公钥）4 秒即判失败且 hosts.yaml 逐字节未变。★ 诚实标注：消灭的是"改公钥"，还没消灭"去控制台粘一条"

  - id: report-export
    label: 结果可导出（任务报告 txt / md）
    since: T2
    done: true
    status: 已具备 —— T2 验收 #4；界面「导出（.txt）/ 复制为 Markdown」，归档到 var/artifacts/exports/

  - id: recipe-engine
    label: 配方引擎 + 服务目录（填 5~8 个参数 → 一次点击跑完一件事；幂等可断言；可卸载）
    since: T5
    done: true
    risk: yellow
    status: 已具备（T5 · 真机与界面都跑过）：配方 = 磁盘上的 YAML（catalog/recipes/*.yaml）+ 模板（catalog/templates/），★ **加一个服务只写 YAML、不改 app 代码**（验收 #8 用假配方验过：装载 / 计划 / 执行全通）。三条宪法落地点：① 只声明"要什么"（expect 白名单），判定一律走平台 —— 配方里没有一处命令/表达式；② 平台统一采集 changed → 变更清单 → **幂等验收 = 第二次该清单为空**（实跑：改参数 → 变了 3 项；原样再跑 → **0 项**，且受管文件 sha256 前后一致、条件步骤未被唤起）；③ 每个正向操作都有反向操作（停止 / 保留数据 / 全删，三个按钮都真跑过，闸门强度按模式取）。模板走 {{ }} 纯替换 + sha256 相同不写盘（不引 Jinja2）；覆盖既有文件前自动备份并登记检查点（失败报告里可一键恢复，恢复后逐字节自证）。规范 §12

  # ================= T6 新增：配方本身也入账（每个配方一条） =================
  # ★ 口径（T6 定，规范 §12.1）：配方**不是动作**（放不进 entries），但按 map.yaml 自己的登记口径，
  #   它属于"不是动作的能力" → **platform: 段每个配方单独一条**，权重 = platform 基准 4（不再 +1）。
  # ★ T5 的账在这一步补上：T5 交付 nginx 配方时只登记了 recipe-engine（引擎能力），
  #   **漏了配方本身的入账** —— 与 T4 漏 platform.done、T5 两次漏 weights 是同一条纪律的第 4 次现形。
  - id: recipe-nginx
    label: 服务配方 · Nginx（一键部署 + 配置校验 + HTTP 健康检查 + 幂等 + 可卸载）
    since: T5
    done: true
    risk: yellow
    status: 已具备（T5 · 真机与界面都跑过）· ★ **本条目是 T6 补的账**：nginx.yaml 全篇只有 expect；实跑"改参数→变 3 项 / 原样再跑→0 项"；三个反向按钮与检查点恢复都真跑过（含 T5 收尾抓到的 5 个真缺陷）

  - id: recipe-mariadb
    label: 服务配方 · MariaDB（代 MySQL：装 server+client + 配置校验 + 真探活 + 幂等 + 可卸载）
    since: T6
    done: true
    risk: yellow
    status: 已具备（T6·S2 · 真机端到端）：★ 名字必须是 mariadb —— Rocky/RHEL 10 里**没有 mysql-server 包**。部署 37.7s / 变更 5 项；**第二次跑 changed = []**、条件步骤未被唤起；健康检查三层（state active + `responds`(mariadb-admin ping→`mysqld is alive`) + **`port_open`**）；`svc.configtest` 的 mariadbd 预设**正反例都真跑过**（写坏配置 rc=7 判红）；本配方**故意不写 preflight**（Rocky 10 上没有像 httpd 那样的天然冲突项，宁可不写也不写假闸门）

  - id: recipe-valkey
    label: 服务配方 · Valkey（代 Redis：站点定制 + 真探活 + 幂等 + 可卸载）
    since: T6
    done: true
    risk: yellow
    status: 已具备（T6·S3 · 真机端到端）· ★ **"第二个服务"这一问的答案**：加它时**引擎零改动**（只写 YAML + 模板），清单站得住。名字必须是 valkey —— Rocky/RHEL 10 里**没有 redis 包**、且只有 `valkey-*` 命令名（没有 `redis-*` 兼容名）。配置写在 `/etc/sysconfig/valkey`（**单元自己留的钩子** `EnvironmentFile=-…` + `$OPTIONS`）：包**没有** drop-in 目录，而写包自带的 `valkey.conf` 会让 `remove_config` 复原不了。★ 负例真跑：把 OPTIONS 写坏 → `valkey-server` **真的起不来**（`svc.restart` 判 failed、探针 3/3 判红）⇒ 这条配置写法**可被证伪**。健康检查 = state active + `responds`(valkey-cli PING→**全等** `PONG`) + `port_open`；第二次跑 changed = []；三个反向按钮真跑（全删：删 `/etc/sysconfig/valkey` + `/var/lib/valkey`、卸包、**收敛检查通过**）

  - id: recipe-nfs
    label: 服务配方 · NFS 服务端（独立导出文件 + 真导出检查 + 幂等 + 可卸载）
    since: T6
    done: true
    risk: yellow
