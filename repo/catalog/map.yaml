    status: '已具备（T16·S1~S8）：**10 个 `vm.*` 动作**（`vm.list` / `vm.status` / `vm.ip` / `vm.snapshot-list` / `vm.wait-guest` 五个只读 ＋ `vm.start` / `vm.stop` / `vm.snapshot-create` 三个 yellow ＋ `vm.stop-hard` / `vm.snapshot-revert` 两个 red）＋ 界面第 **12** 个页签「虚拟机」＋ 编排配方（开机 → 等就绪 → 体检 → 可选关回）。★★ **本条目真正的交点不是"能开机"，而是三条纪律同时落地**：① ★★★ **非 ssh 执行通道**（§12.115）—— 工作台此前"一切执行都经 SSH 到 Linux"，而虚拟化层要动的是**宿主机上的 VMware 本体**（一个 Windows 进程）；通道由**动作**声明（`channel: ssh\|local`），判据只有一句"这条命令在哪台机器上跑"，★ 而"执行面"（任务里记的宿主机）与"意图面"（配方跑的那台 VM）**分开记、都如实**；② ★★ **电源的判据问被管的那一方**（§12.117）—— 三级判据（VMware 收下请求 / `vmrun list` 认为它在跑 / guest 报出 IP），★★ **「起来了」与「能 ssh 进去」是两件事**，不许合成一句"开机成功"；③ ★★★ **VM 归属闸门在平台侧**（§12.116，红线 12）—— `D:\VMs` 下 14 台里 10 台与本项目无关，"能碰的集合" = `hosts.yaml` 登记 ∪ `config.yaml` 的 `vm.extra_allow`（**当次点名，写进文件即留痕**），拒绝话术必须含「**这是保护，不是故障**」，★ 并且**不许靠"id == 目录名"的巧合**（实测 `docker-01` 的 vmx 叫 `vm-docker-01.vmx`）。★ 顺带落成两条口径：**「收条」与「判据」分开写**（§12.119：可能返回非零的那一步 `optional` ＋ 写清理由；★ 判据那一步**必须非 optional**）与 **「问不到」≠「不存在」**（§12.122：探针必须交代"我查了什么键"）。★ 真跑抓到的真缺陷：**只改 `run()` 的通道分派还不够 —— 真正执行的那一行在 `_exec_one` 内部**（表现是"连通性走本机、步骤却去 ssh 127.0.0.1 失败"）。'
  - id: vm-snapshot-guard
    label: 变更前打快照（护栏四件套的第 4 件：整机回滚）
    since: T16
    done: true
    risk: yellow
    status: '已具备（T16）：`vm.snapshot-create`（yellow）＋ `vm.snapshot-list`（green）＋ `vm.snapshot-revert`（🔴 **red**，手输确认词 + 禁批量）。★★ **护栏从三件套升为四件套**（§12.118）：改动前文件备份 / 一键恢复 / `red` 手输确认词 / **变更前打快照** —— 快照是**整机**粒度，与文件级备份**并列不替代**（快照回不了"只回一个文件"）。★★ **触发方式 = 显式**（2026-09-28 拍板）：界面按钮 / 配方步骤 / 人勾选，**不做**"任何变更动作前自动全域快照"（快照占盘 ＋ **会改变快照链**、影响后续回滚语义）。★ 判据**不是**"snapshot 命令返回 0"，而是**再读一次链**：这个名字真的在上面（同名是否报错由 VMware 决定 ⇒ `changed` 由"这个名字原来在不在"算出来）。★ **"回不去"要落在快照链上**：回滚之后"被丢掉的现状"没有任何快照能找回来（除非它本来就在别的快照里）—— 逐项写进结论，**空也写「无」**；★ 并且**如实说**本动作**不断言**"回滚后 guest 里是什么状态"（那要另问 guest）。'

