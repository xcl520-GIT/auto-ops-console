# ============================================================
# 动作：监控 · 当前告警（T10）
# 来源：开题单 §7 验收 #5（"告警真的会响"）
# ★★ 验收 #7（抑制真的生效）的落点**不在本动作** —— 本动作读 Prometheus，
#    而被抑制的那条在 Prometheus 里**照样是 firing**（规范 v1.13 §12.56.1）。抑制请看 `mon.am-alerts`。
# 形态：**两个可选的"必须出现 / 必须不出现"判据** —— 配对使用就能把 `for` 的状态迁移钉住
# 风险：green
# ============================================================

id: mon.alerts
title: 监控 · 当前告警（在响什么）
summary: 读 /api/v1/alerts：firing / pending 各有几条；可按"必须出现某条"与"必须不出现某条"当场判定
domain: J
risk: green
priority: P0
tags: [只读, 监控, 告警, 判据, T10]

note: |
  ★★ 规范 v1.13 §12.55.2「**`for` 的判据是状态迁移，不是文件里的字**」：
    `pending` 与 `firing` 是**两个不同的状态** —— 造条件之后**立刻**查应当 `pending`，
    过了 `for` 再查才应当 `firing`。**"查一次看到 firing"说明不了 for 生效**（可能它一直就响着）。
    ⇒ 本动作配合 `mon.selftest-metric` 一起用：**造条件前先查一次（应为 inactive）**。
  ★★★ 规范 v1.13 §12.56.1「**抑制必须问 Alertmanager，不能问 Prometheus**」：
    本动作读的是 **Prometheus 的 `/api/v1/alerts`** —— 它回答的是「**规则判成什么**」，
    **不是**「Alertmanager 决定投递什么」。抑制发生在**两者之间**。
    ⇒ ★★ **Prometheus 里被抑制的那条照样是 `firing`** ⇒ **本动作的 `expect_absent` 验不了抑制**；
    拿它去验抑制，会得出「抑制没生效」这个**错误**结论。
    ⇒ 验收 #7 的落点是 **`mon.am-alerts`**（问 Alertmanager 的 `/api/v2/alerts`，
    那里被抑制的那条在 `suppressed` 里、**不在 `active` 里**）。
    ★ `expect_absent` 的**正确**用途是「**造条件之前先确认它还没有**」（§12.55.2 的第一跳）。
  ★★ 两个判据参数都是**可选**的，而且**四个 run 元素统一挂同一个 `when`**（规范 §12.51.1）——
    参数为空 ⇒ argv 为空 ⇒ **整步跳过**，而不是拿空值去 grep 出一个假红。

params:
  - name: prom_base
    label: Prometheus 地址
    type: str
    required: true
    default: http://127.0.0.1:9090
    pattern: '^http://127\.0\.0\.1:[0-9]{2,5}$'
  - name: expect_present
    label: 必须出现这条告警（留空则不判）
    type: str
    required: false
    default: ""
    pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
    help: 告警名（`alertname`），例如 AocMonSelfTestCritical。留空 = 跳过这个判据。
  - name: expect_absent
    label: 必须不出现这条告警（留空则不判）
    type: str
    required: false
    default: ""
    pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
    help: ★ 用途是「造条件之前确认它还没有」（§12.55.2 的第一跳）。★★ **不要拿它验抑制** —— 本动作读 Prometheus，被抑制的那条在这里**照样会出现**；验抑制用 `mon.am-alerts`（§12.56.1）。

steps:
  - name: fetch
    title: 取 /api/v1/alerts
    run: [curl, -sS, --max-time, "15", -o, /opt/aoc-monitoring/_out/alerts.json, "{{ prom_base }}/api/v1/alerts"]
    parser: raw
    timeout: 40

  - name: pretty
    title: 整理成稳定文本
    run: [python3, -m, json.tool, /opt/aoc-monitoring/_out/alerts.json, /opt/aoc-monitoring/_out/alerts.pretty.json]
    parser: raw
    timeout: 40

  - name: count_firing
    title: firing 几条
    run: [grep, -c, '"state": "firing"', /opt/aoc-monitoring/_out/alerts.pretty.json]
    parser: raw
    ok_exit_codes: [0, 1]
    timeout: 20

  - name: count_pending
    title: pending 几条
    run: [grep, -c, '"state": "pending"', /opt/aoc-monitoring/_out/alerts.pretty.json]
    parser: raw
    ok_exit_codes: [0, 1]
    timeout: 20

  - name: count_total
    title: 一共几条（firing + pending）
    run: [grep, -c, '"alertname": ', /opt/aoc-monitoring/_out/alerts.pretty.json]
    parser: raw
    ok_exit_codes: [0, 1]
    timeout: 20

  - name: assert_present
    title: ★★ 判据：这条告警必须出现
    optional: true
    run:
      - { when: expect_present, value: grep }
      - { when: expect_present, value: -q }
      - { when: expect_present, value: "\"alertname\": \"{{ expect_present }}\"" }
      - { when: expect_present, value: /opt/aoc-monitoring/_out/alerts.pretty.json }
    parser: raw
    ok_exit_codes: [0]
    timeout: 20
    note: ★ 四个元素**统一挂同一个 `when`**；参数为空 ⇒ argv 为空 ⇒ 整步跳过（规范 §12.51.1）。

  - name: assert_absent
    title: ★★ 判据：这条告警必须不出现（"造条件之前"的那一跳）
    optional: true
    run:
      - { when: expect_absent, value: grep }
      - { when: expect_absent, value: -q }
      - { when: expect_absent, value: "\"alertname\": \"{{ expect_absent }}\"" }
      - { when: expect_absent, value: /opt/aoc-monitoring/_out/alerts.pretty.json }
    parser: raw
    ok_exit_codes: [1]
    timeout: 20
    note: >
      ★ 只接受 rc=1（没命中）；命中 ⇒ 它出现了 ⇒ 判红。
      ★★ 这一步的语义是「**它本来就不该在**」（造条件之前 / 已恢复之后），
      **不是**「抑制生效了」—— 抑制的判据在 `mon.am-alerts`（§12.56.1）。
      拿它去验抑制 = **必然假红**（Prometheus 里被抑制的那条照样是 firing）。

  - name: detail
    title: 每条告警的原件（人读）
    run: [grep, -e, '"alertname": ', -e, '"state": ', -e, '"severity": ', -e, '"instance": ', -e, '"activeAt": ', /opt/aoc-monitoring/_out/alerts.pretty.json]
    parser: lines
    ok_exit_codes: [0, 1]
    optional: true
    note: >
      ★★ rc=1 也算成功：**"一条告警都没有"是结论，不是出错**。
      ★ 真跑实测（T10·S7-A）：基线那一次 `mon.alerts` 就有了 `步骤失败 1/8` —— 因为这一步没声明 rc=1。
      ★★ 这与 T9 抓到的 ⑫（`when` 挂一半 ⇒ 只读动作挂一条"步骤失败"）**是同一张脸**：
      **"没有内容"被当成了"出错"**（规范 §12.51 同族）。**陈列型步骤必须接受 rc=1。**
    timeout: 20

verify:
  - name: 必须读到告警面
    from: count_total
    on_missing: /api/v1/alerts 没有返回内容 —— Prometheus 在不在？

conclusion: |
  【{host.name}】监控 · 当前告警
  Prometheus：{prom_base}
  **firing {count_firing}** ｜ **pending {count_pending}** ｜ 合计 {count_total}
  判据：必须出现「{expect_present}」｜ 必须不出现「{expect_absent}」

  逐条（告警名 / 状态 / 严重度 / 实例 / 起始时间）：
  {detail}

  判读：
  · ★★ **`for` 的判据是状态迁移**：造条件之后**立刻**查应当是 **pending**、过了 `for` 才是 **firing**。
    只查一次看到 firing **说明不了 for 生效** —— 要在造条件**之前**先查一次（那时应当没有这条）；
  · ★★★ **本动作读的是 Prometheus ⇒ 它判不了抑制**（§12.56.1）：被抑制的那条**在这里照样是 `firing`**
    —— 抑制是 Alertmanager 在**投递前**做的决定。⇒ **验抑制请用 `mon.am-alerts`**
    （问 `/api/v2/alerts`，被抑制的那条在 `suppressed` 里、不在 `active` 里）；
    ★ 拿本动作去验抑制 = **必然假红**；`expect_absent` 只用来表达「它本来就不该在」；
  · `activeAt` 是它**进入当前状态**的时刻（pending 与 firing 各有一个），可用来核对 `for` 的时长；
  · 本动作只读：不 silencing、不 resolve、不改任何东西。
