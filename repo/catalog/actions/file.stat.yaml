# ============================================================
# 动作：路径状态（它在不在）
# 来源：T7 主线 2「卸载幂等」缺的那一只眼睛（规范 §12.16）
# 形态：**只读**（green）—— 只回答"这个路径存不存在"，不碰任何东西
# ============================================================

id: file.stat
title: 路径状态
summary: 一个文件或目录在不在（ls -ld；退出码 2 = 不存在，那是结论不是错误）
domain: C
risk: green
priority: P1
tags: [只读, 文件]

note: |
  ★ 为什么需要它（规范 §12.16）：全删的**收敛检查**必须覆盖"包 **和** 路径"两类 ——
  包有 `pkg.installed` 可查，**路径却一直没有只读的"它在不在"**。
  没有它，"目录真的删掉了吗"就只能看删除命令是不是返回 0（那是**假绿**的老路）。

  ★★ **退出码语义（这个动作最容易被写错的地方）**：
     · `ls -ld <路径>` → **0 = 存在**、**2 = 不存在**
     · ★ **2 不是错误**，它和 `dnf check-update` 的 `100`（有更新）、`rpm -q` 的 `1`（没装）
       **是同族的**：**命令的退出码不是错误码，是它的一句话结论**。
     · 所以 `ok_exit_codes` 写 **[0, 2]**：两种都是"正常报告"。
       若只写 0，则"路径不存在"会变成步骤失败 → 收敛检查永远无法判"已经删干净了"。

  ★★ **为什么同一条命令要跑两步（`stat` 与 `count`）—— T7·S1 真跑当场抓到的缺陷**：
     第一版只用一步（`parser: raw`）并拿它做自证，于是**"路径不存在"这个正常结论被判成
     VERIFY_FAILED**（实测：查 `/opt/aoc-t7-probe` → 动作 failed）。根因是规范 §9.6 早就写过的那句：
     **verify 判的是"这个值有没有"，不是"这个值是多少"** ⇒
     "不存在 ⇒ 输出为空"这种**结论**，绝不能用"非空断言"去自证（那 100% 假失败）。
     ⇒ 拆成两步、**两个解析器**：
       · `stat`（`raw`）—— 给人看的原文（不存在时它就是空的，**这是对的**）；
       · `count`（`line_count`）—— 给机器判的行数：**1 = 在、0 = 不在**；
         ★ 引擎对"数行数"专门补过一条：**空输出对它是"0 行"这个结论，不是"取不到数据"**
           （§10.6.3「空结果 ≠ 空数据」）⇒ 于是 0 是个**有值的结论**，自证不会假失败。

  ★ 参数白名单与 `file.remove` **逐字相同**（不是抄，是刻意对齐）：
    凡是我们**删得掉**的路径，就一定能**查得着**它删没删 —— 否则收敛检查会有盲区。

params:
  - name: path
    label: 路径
    type: str
    required: true
    pattern: '^/(etc|var/lib|var/log|opt|var/www)/[A-Za-z0-9_@+][A-Za-z0-9._@+-]*(/[A-Za-z0-9_@+][A-Za-z0-9._@+-]*)*$'
    placeholder: /opt/aoc-nfs/demo
    help: '与「受限删除」同一套白名单：/etc/<名>、/var/lib/<名>、/var/log/<名>、/opt/<名>、/var/www/<名>；每段不得以点开头（于是 .. 一律被拒）'

steps:
  - name: stat
    title: 路径原文（人看的那一行；不存在时这里是空的）
    run: [ls, -ld, "{{ path }}"]
    parser: raw
    ok_exit_codes: [0, 2]
    timeout: 20
    note: >
      ★ 退出码 0 = 存在、2 = 不存在，两个都是**结论**（规范 §9.6 同族的坑）。
      ★ 但**这一行不许用来做自证**：路径不存在时它的输出**本来就是空的**，
      而 verify 判的是"有没有值" ⇒ 拿它自证会 100% 假失败。

  - name: count
    title: 它在不在（★ 数行数：1 = 在、0 = 不在；这一步同时是自证与期望来源）
    run: [ls, -ld, "{{ path }}"]
    parser: line_count
    ok_exit_codes: [0, 2]
    timeout: 20
    note: >
      ★ 为什么与上一步是**同一条命令、两个解析器**：`raw` 对空输出给"无"（那是给人看的），
      而 `line_count` 对空输出给 **0**（那是**结论**）—— 见本动作 note 里那段说明。
      ★ 本步是 `expect.absent` 在**路径**上的存在性来源（`app/expect.py` 的 `PRESENCE_SOURCES`）。

  - name: size
    title: 体积（目录给总量）
    run: [du, -sh, "{{ path }}"]
    parser: raw
    ok_exit_codes: [0, 1]
    optional: true
    timeout: 60
    note: >
      ★★ `ok_exit_codes: [0, 1]` —— **路径不存在时 du 返回 1，"体积（无）"是结论、不是出错**。
      ★ 原来只标了 `optional`：那让**任务**不失败，但这一步仍被记成「**步骤失败**」
      ⇒ 一个**只读**动作挂着「步骤失败 1/3」（**T10·S9 收尾时实测撞到**）。
      ★★ 规范 §12.64 ⑥：**"optional 只解决『任务成败』，不解决『横幅在撒谎』"** —— 两件事都要管。

verify:
  - name: 「它在不在」这一步必须问得出来（★ 0 行也是结论；只有"问不出来"才判红）
    from: count
    on_missing: >
      ls 的退出码既不是 0 也不是 2，而且连行数都数不出来（例如权限不足 / 路径不可达）
      —— 这时**无法判定它在不在**，不要当成"不存在"。

conclusion: |
  【{host.name}】路径状态（只读）
  查询路径：{path}
  · 它在不在：{count}（1 = 在 ｜ 0 = 不在）
  · ls -ld 原文：{stat}
  · 体积：{size}

  判读：
    · `ls -ld` 那行**有内容 ⇒ 存在**；**空 ⇒ 不存在**（退出码 2，是结论不是错误）；
    · ★ 本动作**只读**：不创建、不删除、不改动任何东西；
    · 它最常出现在「卸载·全删」的收敛检查里：**真有东西没删掉就会判红**
      （包查 `pkg.installed`、路径查本动作 —— 两条都过才算收敛）。
