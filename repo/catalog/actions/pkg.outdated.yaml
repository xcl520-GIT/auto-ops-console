# ============================================================
# 动作：可升级清单（升级预检）
# 来源：T7 服务治理 —— ★ 升级这件事缺的"预检"那一半（规范 §12.15.2）
# 形态：**只读**（green）—— 不改任何包、不动任何配置
# ============================================================

id: pkg.outdated
title: 可升级清单
summary: 这台机器上装了哪些"仓库里有更新"的包（升级预检，只读），等价于 dnf check-update
domain: H
risk: green
priority: P1
tags: [只读, 包管理, dnf, 升级]

note: |
  ★ 为什么必须有这个动作：`pkg.update` 只回答"**这一只**包要不要升"，
  而**没有任何动作回答"这台机器上**有哪些包可以升**"**。
  ⇒ 结果是：**没有人愿意在没有预检的情况下按升级按钮**（规范 §12.15.2）。

  ★★ **退出码语义（这个动作最容易写错的地方）**：
  `dnf check-update` 的退出码是它**的一句话结论**，不是错误码：
    · **100 = 有可升级的包**
    · **0   = 没有可升级的包**
  ⇒ 所以 `ok_exit_codes` 必须写 **`[0, 100]`**。
  ★ 照抄网上"非 0 即失败"的说法，会把"**有更新**"永远报成错误 ——
  这与 `pkg.search` 里"`rpm -q` 的 rc = 缺几个包"是**同族的坑**：
  ★★ **命令的退出码不是错误码，是它的一句话结论。**

  ★★ **源不可达 ≠ 没有更新**：仓库元数据拿不到时，本动作要给出**明确的原因与建议**，
  **绝不允许**把"查不到"显示成"没有可升级的包"（规范 §10.6.3「空结果 ≠ 空数据」）。
  ★ 现成反例：`docker-01` 的软件源指向失效的本地 ISO ⇒ `pkg.*` 在它上面必然失败。

params: []

steps:
  - name: repos
    title: 先看仓库配置（拿不到仓库就谈不上"有没有更新"）
    run: [dnf, -q, repolist]
    parser: lines
    timeout: 90
    note: >
      ★ 这一步是**判读的地基**：它列出本机配置了哪些仓库、是否 enabled。
      仓库是空的 / 全是 disabled ⇒ 下面的"没有可升级的包"**不可信**，
      必须按"无法判定"来读（结论里会点出来）。
      ★ 也正因为这一步**总有输出**（只要 dnf 可用），verify 里用**它**来承担"这次真的问到了"。

  - name: check
    title: 问一句"有没有可升级的包"（dnf check-update）
    run: [dnf, -q, check-update]
    parser: lines
    ok_exit_codes: [0, 100]
    timeout: 180
    note: >
      ★★ 退出码是**结论**不是错误：**100 = 有更新、0 = 无更新**（规范 §12.15.2）。
      ★ **没有可升级的包时输出为空** —— 那是**结论**（"无更新"），不是"取不到数据"。
      所以**判据用这一步的「状态」，绝不能用「输出非空」**（与 `net.port` 判"端口空闲"同一条纪律，§10.6.3）。
      ★ 仓库元数据不在本地时会自动下载（全 NAT 环境可出网，首次会慢）。

verify:
  - name: 必须能读到仓库清单（否则"没有更新"这句话没有地基）
    from: repos
    on_missing: 拿不到仓库清单 —— dnf 不可用或没有任何启用的仓库，本次"可升级清单"不可信
  - name: 更新检查这一步必须跑过（★ 不要求它"有输出" —— 无更新时本来就是空的）
    from: check
    severity: warn
    on_missing: check-update 这一步没有正常结束；看它的原始输出与退出码（★ 100 是"有更新"，不是失败）

conclusion: |
  【{host.name}】可升级清单（升级预检 · 只读）
  ── 仓库配置（上面这段没有内容 = 没有任何仓库 ⇒ 下面那句"没有更新"不可信）──
  {repos}

  ── 可升级的包（dnf check-update；★ 空 = 没有可升级的）──
  {check}

  判读：
  · 上面第二段**为空** ⇒ 这台机器**当前没有可升级的包**（★ 这是**结论**，不是"查不到"）；
  · 有内容 ⇒ 每行是「包名.架构 · 可用版本 · 仓库」——
    要升某一只包，用「更新指定软件包」动作（**只升这一只**，平台刻意不做全量 `dnf update`）；
  · ★ 「仓库配置」段为空 / 全是 disabled / 报源不可达 ⇒ **本次结论是"无法判定"**，
    **不是"没有可升级的包"**：先修仓库（`dnf makecache`、检查 `/etc/yum.repos.d/`）再回来看；
  · ★ 升级之后要**重跑一次对应配方**（「部署 / 收敛」）—— 应当**零变更**；
    若变了，那是判据把"包版本变了"误判成了"我们的配置变了"（规范 §12.15.1）；
  · ★ 回退：升级会产生一条 dnf 事务，用「回退软件包事务」动作按事务号回退（规范 §12.15.3）；
  · 本动作只读：不安装、不升级、不改仓库配置。
