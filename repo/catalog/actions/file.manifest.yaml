# ============================================================
# 动作：目录清单 + 小文件摘要（留证用）
# 来源：T8·S3「旧集群全量留证」缺的那一只手（规范 §12.30）
# 形态：**只读**（green）—— 只把声明过的目录里的"有什么 + 各多大 + 各自多旧 +
#       小文件的 sha256"交出来，**不读文件内容**（内容归 file.cat / file.pull）
# ============================================================

id: file.manifest
title: 目录清单与小文件摘要
summary: 一个目录的条目清单（类型/字节/时间/权限/属主/路径）+ 小文件的 sha256（留证用，只读）
domain: C
risk: green
priority: P1
tags: [只读, 文件, 留证]

note: |
  ★ 为什么需要它（规范 §12.30）：T8·S3 要对"停着的旧集群"做**全量留证** —— 清单 + sha256 + 原文。
  当时的家底：`file.stat` 只能问**一个**路径在不在、`file.grep` 只能在文件里找**一行**，
  ★ **没有**任何动作能回答"这个目录底下有什么、各多大、各自多旧、各是什么摘要"。
  于是"留证"只能靠人 ssh 上去敲 `find` —— 那既违背本项目的验证口径，也让留证变成不可复现的手工活。

  ★★ **两条硬规矩（与 `file.cat` 同源）**：
  ① **路径白名单**（参数 `pattern`）—— 只放行**声明过的**目录前缀；
  ② ★★ **密钥类永不摘要**：`find` 的表达式里挂了一组 `! -name`，
     把 `id_*` / `*.key` / `*.pem` / `authorized_keys` / `shadow` / `gshadow` 排除掉。
     ★ 摘要不是原文，但**私钥的摘要同样是敏感物**（可用来比对/确认），能不碰就不碰。

  ★ **零内容**：本动作**只列清单**，不 `cat` 任何东西 —— 想看原文用「读文件原文」，
  想把原文整份搬回管理机用「取回文件」。三只手的分工写死在各自的 note 里。

  ★★ **它为什么"永远不判红"（刻意如此）**：留证的正确语义是**如实报告**，不是"必须存在"。
  所以：
   · 路径不存在 ⇒ `ls -ld` 给 `2`（**结论**，不是错误，§12.16 同族）；
   · 目录为空 ⇒ 清单 **0 条**（**结论**，不是"取不到数据"，§10.6.3）；
   · 自证**只挂在"数行数"那两步上**（`line_count` 对空输出给 0，那是**有值的结论**）——
     ★ 绝不允许拿 `raw` / `lines` 的空输出去做"非空断言"，那正是 `file.stat` 第一版
       100% 假失败的老路（§9.6 / 检查清单 80）。

  ★ 清单格式是 `find -printf` 的**制表符分隔**六列（类型/字节/mtime/权限/属主:属组/路径）——
  不用 `ls -lR` 那种人读表格：它的列宽、时间格式、locale 都会变（解析器口径，§3）。

params:
  - name: path
    label: 要留证的目录
    type: str
    required: true
    default: /etc/kubernetes
    pattern: '^/(etc/(kubernetes|containerd|cni/net\.d|sysctl\.d|modules-load\.d|yum\.repos\.d)|opt/cni|var/lib/(etcd|kubelet|containerd)|var/backups/aoc|data|root/\.kube)(/[A-Za-z0-9_@+][A-Za-z0-9._@+-]*)*$'
    placeholder: /etc/kubernetes
    help: '只允许这些前缀：/etc/{kubernetes,containerd,cni/net.d,sysctl.d,modules-load.d,yum.repos.d} · /opt/cni · /var/lib/{etcd,kubelet,containerd} · /var/backups/aoc · /data · /root/.kube；每段不得以点开头（于是 .. 一律被拒）'
  - name: depth
    label: 往下钻几层
    type: int
    required: true
    min: 1
    max: 8
    default: 3
    help: '1 = 只看直接子项；3 = 够看清 /etc/kubernetes 这种配置树。★ /var/lib/containerd 这类镜像缓存树要给 1 或 2，否则清单会被输出上限截断（截断会被标记，不会静默）。'
  - name: size_limit
    label: 给多大以内的文件算 sha256
    type: enum
    choices: ["≤ 1MB", "≤ 2MB", "≤ 10MB", "≤ 50MB"]
    values: ["1M", "2M", "10M", "50M"]
    default: "≤ 2MB"
    help: '配置文件/证书/单元文件都远小于 2MB；镜像缓存里的大 blob 不给摘要（它们有内容摘要就够占证据体积了）。'

precheck:
  - name: find_available
    title: 确认目标机上有 find（镜像里它是 findutils，基线自带）
    run: [find, --version]
    parser: raw
    ok_exit_codes: [0]
    note: >
      ★ 这一步**没有** `test -d` —— 刻意的：路径不存在的**结论**要由动作如实报出来
      （§12.16 / `file.stat` 的教训），而不是靠预检把它拦成"没跑"。
      预检只回答"这只手在不在"，不回答"东西在不在"。

steps:
  - name: root_count
    title: 起点在不在（★ 数行数：1 = 在、0 = 不在；本步是自证来源之一）
    run: [ls, -ld, --, "{{ path }}"]
    parser: line_count
    ok_exit_codes: [0, 2]
    timeout: 20
    note: >
      `ls -ld` 的退出码 0 = 在、2 = 不存在，**两种都是正常报告**。
      ★ 自证挂在这里而不是 `raw` 那一步：空输出对 `line_count` 是 **0 这个结论**（§10.6.3）。

  - name: root
    title: 起点原文（人看的那一行；不存在时这里是空的）
    run: [ls, -ld, --, "{{ path }}"]
    parser: raw
    ok_exit_codes: [0, 2]
    timeout: 20
    note: 与 `root_count` 是**同一条命令两个解析器**（`file.stat` / `file.cat` 的同一个做法）。

  - name: tree_count
    title: 清单条目数（★ 空目录 / 不存在都落在 0 这个结论上；本步是自证来源之二）
    run: [find, "{{ path }}", -maxdepth, "{{ depth }}", -xdev, -printf, '%y\t%s\t%T@\t%M\t%u:%g\t%p\n']
    parser: line_count
    ok_exit_codes: [0, 1]
    timeout: 90
    note: >
      ★ 退出码 1 对 `find` 是"**部分目录读不到**"（如权限不足）—— 它**不是**"清单没取到"，
      所以列进正常报告；真正的故障（命令不存在 / 参数非法）是其它退出码。
      ★ 六列分别是：类型（d/f/l/…）· 字节 · mtime(epoch) · 权限 · 属主:属组 · 路径。

  - name: tree
    title: 清单原文（制表符分隔六列；超过输出上限会截断并标记）
    run: [find, "{{ path }}", -maxdepth, "{{ depth }}", -xdev, -printf, '%y\t%s\t%T@\t%M\t%u:%g\t%p\n']
    parser: lines
    ok_exit_codes: [0, 1]
    timeout: 90
    note: 原文照给，平台不排序不摘要（排序/取 TOP 属于"结论"，那是另一类动作的事）。

  - name: digest_count
    title: 摘要条目数（★ 本步是自证来源之三）
    run:
      - find
      - "{{ path }}"
      - -maxdepth
      - "{{ depth }}"
      - -xdev
      - -type
      - f
      - -size
      - "-{{ size_limit }}"
      - "!"
      - -name
      - "id_*"
      - "!"
      - -name
      - "*.key"
      - "!"
      - -name
      - "*.pem"
      - "!"
      - -name
      - authorized_keys
      - "!"
      - -name
      - shadow
      - "!"
      - -name
      - gshadow
      - -exec
      - sha256sum
      - --
      - "{}"
      - "+"
    parser: line_count
    ok_exit_codes: [0, 1]
    timeout: 120
    note: >
      ★ `-exec sha256sum -- {} +`：一次批量喂多个文件（`+` 而不是 `;`），
      不经过 shell（§4 三层安全契约：argv 数组 + 无元字符）。
      ★ 那六组 `! -name` 是**密钥类永不摘要**的白名单（与 `file.cat` 的负向前瞻同一份名单）。

  - name: digest
    title: 小文件 sha256 原文
    run:
      - find
      - "{{ path }}"
      - -maxdepth
      - "{{ depth }}"
      - -xdev
      - -type
      - f
      - -size
      - "-{{ size_limit }}"
      - "!"
      - -name
      - "id_*"
      - "!"
      - -name
      - "*.key"
      - "!"
      - -name
      - "*.pem"
      - "!"
      - -name
      - authorized_keys
      - "!"
      - -name
      - shadow
      - "!"
      - -name
      - gshadow
      - -exec
      - sha256sum
      - --
      - "{}"
      - "+"
    parser: lines
    ok_exit_codes: [0, 1]
    timeout: 120
    note: 与 `digest_count` 是同一条命令两个解析器（同 `tree` / `tree_count` 的关系）。

verify:
  - name: 必须问得出"起点在不在"（★ 数行数这一步）
    from: root_count
    on_missing: >
      `ls -ld` 的退出码既不是 0 也不是 2 —— 这时**无法判定它在不在**，
      请把"不在"与"问不出来"分开看（§10.6.3）。
  - name: 必须问得出清单条目数（★ 数行数这一步）
    from: tree_count
    on_missing: >
      find 没给出可数的行 —— 清单这一步不可信，**不要**拿它当留证。
      0 条是结论（空目录 / 路径不存在），不是"没问出来"。
  - name: 摘要步骤必须给出行数
    from: digest_count
    severity: warn
    on_missing: 摘要段拿不到行数 —— 清单仍可用，但 sha256 部分这一份不可信

conclusion: |
  【{host.name}】目录清单与小文件摘要（只读 · 留证用）
  留证目录：{path}
  · 起点在不在：{root_count}（1 = 在 ｜ 0 = 不在）｜ ls -ld 原文：{root}
  · 往下钻几层：{depth} ｜ 清单条目数：{tree_count}
  · 摘要口径：单文件 {size_limit} 以内 ｜ 摘要条目数：{digest_count}
  ── 清单（类型 字节 mtime epoch 权限 属主:属组 路径）──
  {tree}
  ── sha256 ──
  {digest}
  ── 到此为止 ──

  判读：
    · 本动作**只列清单与摘要，不读任何文件内容** —— 要看原文用「读文件原文」，
      要把整份原文搬回来用「取回文件」；
    · ★ 清单条目数 **0** 而起点在 ⇒ 空目录（合法结论）；
      起点不在 ⇒ `root_count` = 0，那正是"这个旧集群**没有**这一块"的结论；
    · ★ **密钥类（`id_*` / `*.key` / `*.pem` / `authorized_keys` / `shadow` / `gshadow`）
      一律不参与摘要** —— 它们会出现在清单里（说明"这里有个私钥文件"），但**不会**有 sha256；
    · ★ 超过输出上限的部分会被**截断并标记**：给大目录（镜像缓存）把 `depth` 调小，
      或者分几次按子目录留证 —— 不要拿截断过的清单当"全量"。
