# ============================================================
# 动作：按事务号回退软件包变更
# 来源：T7 主线 1「升级」—— ★ 补的是一笔**欠账**（规范 §12.15.3）
# 形态：**red**（手输确认词 + 禁止批量）—— 回退 = 变更的反方向，同样会改机器状态
# ============================================================

id: pkg.rollback
title: 按事务号回退软件包变更
summary: 用 dnf history undo <事务号> 回退一次装/升/卸，并自证"版本回到了变更前"
domain: H
risk: red
priority: P1
tags: [变更, 破坏性, 包管理]

note: |
  ★★ **这个动作存在的唯一理由，是一笔欠账**：
  `pkg.install` / `pkg.update` / `pkg.remove` 的结论模板里**一直在写**
  "回退：`dnf history undo <事务号>`" —— 而在 T7 之前，**全库没有任何动作能做这件事**。
  也就是说我们承诺了一条"**得让人自己 ssh 上去敲**"的回退路径。
  ★ 与检查清单 47 同族：**承诺兑现不了，比不承诺更坏**。

  ★★ **事务号（`tx`）从哪来**：**不许凭记忆填**。它必须来自"先看一眼历史"那一步 ——
     · 在「更新指定软件包」/「安装软件包」/「卸载软件包」的结论里，
       最后那段"最近事务（回退依据）"就是它；
     · 本动作自己也**先把历史摆出来**（第一步 `list`，只读），
       并在结论里把"这次回退撤掉了什么"原文念出来。

  ★★ **自证**（规范 §12.15.3）：**不是"命令返回 0"**，而是"**版本回到变更前**"：
     · 填了 `package` ⇒ 回退**前**、回退**后**各查一次版本，**逐字对照**摆在结论里；
     · 没填 `package` ⇒ 靠"回退后的事务清单里能看到那条**反向事务**"作旁证，
       并在结论里**如实说清"这次没做版本对照"**（不许把旁证说成实证）。

  ★★ **回退不是万能**：它撤的是 **dnf 的事务**。期间服务已经产生的故障时间、
     已经写进数据文件的内容、以及别的机器上发生的事，**回退都收不回来**（规范 §12.19）。
     结论里会逐项把"回不去的"点出来。

confirm:
  title: 确认回退这次软件包变更
  body: |
    即将在「{host.name}」（{host.address}）上**按事务号回退**：

      事务号：{tx}
      （填了包名的话）只看它：{package}

    会发生什么：dnf 会为这次回退**新开一条反向事务** ——
    该事务里装上的包被卸掉、卸掉的包装回来、升级的包退回旧版本（含依赖）。

    能不能撤回：回退本身**也是一次变更**，它会留下**它自己的事务号**；
      再"回退这条回退"在 dnf 层面不一定成立（要看具体包），所以请把上面的版本对照看准了再动手。

    ★ 请先核对事务清单（本动作第一步会把 dnf history 原文打出来）里的 ID 与描述，
      确认要撤的就是这一条。
  confirm_text: 我已确认要回退

params:
  - name: tx
    label: 事务号
    type: int
    required: true
    min: 1
    max: 1000000
    placeholder: '12'
    help: '来自「最近事务（回退依据）」那一段里的 ID 列；★ 不许凭记忆填 —— 先看历史'
  - name: package
    label: 顺便对照这个包的版本（可留空）
    type: str
    required: false
    pattern: '^[A-Za-z0-9._+-]{1,64}$'
    placeholder: bc
    help: '填了就做"回退前 / 回退后"版本逐字对照（那是**自证**）；留空则只能靠事务清单作旁证'

steps:
  - name: list
    title: 先把事务清单摆出来（★ 只读：确认要撤的是哪一条）
    run: [dnf, history]
    parser: head_lines
    timeout: 90
    note: >
      ★ "列事务 → 回退 → 自证"里的第一步（规范 §12.15.3）。
      没有它，"回退"就变成了一次**盲操作** —— 而它恰恰是最该看清再动手的一类操作。

  - name: ver_before
    title: 回退前版本（填了包名才跑）
    run:
      - { when: package, value: rpm }
      - { when: package, value: -q }
      - { when: package, value: "{{ package }}" }
    parser: raw
    optional: true
    ok_exit_codes: [0, 1]
    note: rc=1（还没装）同样是有效信息 —— 回退之后它可能就装回来了。

  - name: undo
    title: 回退（★ 这一步才会真的改机器状态）
    run: [dnf, history, undo, "{{ tx }}", -y]
    parser: lines
    timeout: 600

  - name: ver_after
    title: 回退后版本（填了包名才跑）
    run:
      - { when: package, value: rpm }
      - { when: package, value: -q }
      - { when: package, value: "{{ package }}" }
    parser: raw
    optional: true
    ok_exit_codes: [0, 1]

  - name: history_after
    title: 回退后的事务清单（★ 反向事务的旁证）
    run: [dnf, history]
    parser: head_lines
    timeout: 90
    note: >
      ★ 回退会**新开一条事务**。这条清单就是"确实发生过一次回退"的旁证；
      ★ 但旁证**不等于**实证 —— 实证是上面的版本逐字对照（规范 §12.15.3）。

verify:
  - name: 事务清单必须可读（★ 没有历史就没有回退依据，这一步不许糊）
    from: list
    on_missing: 读不到 dnf 事务记录 —— 在不知道"要撤的是哪一条"的情况下不许回退
  - name: 回退这一步必须跑过（否则谈不上回退）
    from: undo
    on_missing: dnf history undo 没有正常结束；看它的原始输出与退出码
  - name: 回退后的事务清单必须可读（反向事务要留证）
    from: history_after
    on_missing: 回退后读不到事务记录 —— 这次回退**无法留证**，请手工核对

conclusion: |
  【{host.name}】按事务号回退（🔴 red · 已手输确认词）
  回退事务号：{tx} ｜ 对照包：{package}

  ── 回退前的事务清单（要撤的就是这里面的一条）──
  {list}

  ── dnf 的回退原文（★ 它这次撤掉了哪些包动作，看这里）──
  {undo}

  ── 版本对照（★ 自证：这里是"版本真的回到变更前"的唯一硬证据）──
    · 回退前：{ver_before}
    · 回退后：{ver_after}

  ── 回退后的事务清单（★ 旁证：能看到那条**反向事务**）──
  {history_after}

  判读：
    · **填了包名** ⇒ 上面两行版本**逐字对照**就是自证（从 A 变回 B）；
    · **没填包名** ⇒ 只有事务清单这个**旁证**，★ 本次**没有做版本对照**，别把它当成实证；
    · ★★ **回退收不回来的东西**（规范 §12.19，逐项点清，空也要写"无"）：
        – **服务故障时间**：回退能把包装回去，但服务**坏着的那段时间回不来**；
        – **数据 / 运行时状态**：回退只动包，**已经写进数据文件的内容一律不回退**；
        – **别的机器**：这次回退只作用于本机，其它机器上发生过的事一件也撤不掉。
    · 回退本身也留了一条**新事务**：再要往回走，用它的 ID 再来一次这个动作。
