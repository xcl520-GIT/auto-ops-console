# ============================================================
# 动作：虚拟机清单（含归属）
# 来源：设计\05-虚拟化层-架构设计.md §3 · 总纲 §4.2 第六阶段 T16
# 形态：一次给全结论（在跑的是谁 + 全量有哪些 + 谁归本项目管 + 查了哪些键）
# 风险：green ｜ ★★ 执行通道：local（本机 vmrun.exe，不走 ssh，规范 §12.115）
# ============================================================

id: vm.list
title: 虚拟机清单（含归属）
summary: 一眼看清宿主机上所有虚拟机：哪些在跑、哪些归本项目管、哪些只读可见不可操作
domain: M
risk: green
priority: P0
channel: local
tags: [只读, 虚拟化, 盘点]
note: |
  ★ 三件事一起说清（规范 §12.122「问不到 ≠ 不存在」）：
    ① **在跑的是谁** —— 问 **VMware 自己**（`vmrun list`），不是问"文件在不在"；
    ② **全量从哪来** —— 扫 `vm.allow_vmx_dirs` ＋ **只读**读 `inventory.vmls`
       （★ 后者在中文 Windows 上**不保证是 UTF-8**：读错了同一台机器会在盘面上**出现两次**，
        所以有编码回退 —— 实测出来的坑）；
    ③ **归属怎么算** —— 只有 `hosts.yaml` 里登记了 `vm.vmx` 的才算"本项目管"（红线 12）。
  ★★ 本动作**只读**：把"只读可见 · 不可操作"标出来，**不是**"允许操作"的意思。
  ★ 它**没有 `vm` 参数** —— 盘面本身就是"全部"，不针对某一台。

params: []

steps:
  - name: scan
    title: 盘点（在跑 + 全部 + 归属 + 交代查了什么）
    run: ["{{ vm_probe_py }}", "{{ vm_probe_script }}", "--mode", "list"]
    parser: json
    timeout: 120
    note: |
      ★ 探针只做三件**只读**事：`vmrun list` / 扫白名单目录 / 只读 inventory.vmls。
      退出码语义：0 = 读到了 · 3 = 期望不成立 · 2 = **读不到**（vmrun 不在等）。

verify:
  - name: 必须拿到虚拟机盘面
    from: scan
    field: count
    on_missing: 探针没有返回盘面（vmrun 可能不可用，或 config.yaml 里的 vm 段没配好）

conclusion: |
  【宿主机】虚拟机盘面（查了：{scan.checked}）

  在跑：{scan.running} 台 ｜ 全部：{scan.count} 台 ｜ 本项目管：{scan.managed} 台

  {scan.table}

  判读：
  · ● 在运行 / ○ 已关机 —— **状态一律问 VMware 自己**（`vmrun list`），不看文件时间戳；
  · 「本项目管」= 在 hosts.yaml 里登记了 vm.vmx 的机器（红线 12）；
  · 「只读可见 · 不可操作」不是故障，是**保护**：磁盘上还躺着与本项目无关的虚拟机，
    工具**只看得见、不碰**。确实要操作某一台时，把它加进 config.yaml 的 `vm.extra_allow`（当次点名，写进文件即留痕）。
  · 若某台机器**看起来缺了**：先看这里的"查了哪些键"——★ 「问不到」不等于「它不存在」（规范 §12.122）。

  白名单目录：{scan.allow_dirs}
  当次点名：{scan.extra_allow}
