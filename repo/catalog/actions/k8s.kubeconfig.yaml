# ============================================================
# 动作：装入 kubeconfig（kubectl 的入口）
# 来源：T8·S6 —— 规范 §12.32.1（"它不改集群，只改这只机器上的一个文件"）
# 形态：**变更**（yellow）—— 写一个文件（覆盖前有备份护栏）
# ============================================================

id: k8s.kubeconfig
title: 装入 kubeconfig（kubectl 的入口）
summary: 把 /etc/kubernetes/admin.conf 装到 ~/.kube/config —— 判据是 `cmp` 的退出码（复制类操作唯一的硬判据）
domain: J
risk: yellow
priority: P1
tags: [变更, K8s, kubeconfig]

note: |
  ★★ **为什么它必须单独一只手**（规范 §12.32.1）：
  它**不改集群**，只改**这一台机器上的一个文件**。失败时最容易误判成"集群没建好"——
  所以它单独一张卡：失败时能一眼看出"是入口没装好"而不是"集群坏了"。

  ★★ **复制类操作的唯一硬判据是 `cmp` 的退出码**（规范 §12.32.2）：
  不要拿"文件在不在"或"`cp` 返回 0"当判据 ——
  `admin.conf` 与 `~/.kube/config` **内容必须逐字节相同**，`cmp -s` 的退出码就是这句话。
  · `0` = 一模一样（**幂等**：这次什么都没改）；
  · `1` = 内容不同（或目标不存在）⇒ 这次是**真变更**；
  · `2` = 读不到（源不在 / 目标目录不可写）⇒ **无法判定**，不许猜。

  ★ `install -m 0600` 而不是 `cp`：kubeconfig 里带着**集群管理员凭据**，
  权限必须一次到位（`cp` 会沿用 umask，可能给到 0644）。★ `install` 还会**先删再建**，
  于是"目标已存在且是链接"这类情形不会变成静默的跟随写。

confirm:
  title: 确认装入 kubeconfig
  body: |
    即将在「{host.name}」（{host.address}）上把：

      {source}   →   {dest}

    会发生什么：**只改这一台机器上的一个文件**（不影响集群、不影响其它机器）。
    目标文件权限设为 `0600`（它带着集群管理员凭据）。

    **回得来吗**：✅ 改动前的目标文件已在平台的**检查点**里留了一份，
    在「历史」里找到这条任务 → 点一次「恢复」即可回到改动前。
    ★ 若原本不存在，则"恢复"= 把它删掉（报告里会写清）。

    **幂等**：内容已经一模一样时 ⇒ **不写盘**（`changed=false`）。
  confirm_text: 我已确认装入 kubeconfig

backup:
  - path: "/root/.kube/config"
    label: "原有的 kubectl 入口（首次部署时不存在，属正常）"
    required: false

params:
  - name: source
    label: 源文件（集群管理员的 kubeconfig）
    type: str
    required: true
    pattern: '^/etc/kubernetes/[A-Za-z0-9._-]+\.conf$'
    default: /etc/kubernetes/admin.conf
    help: '★ 白名单只放行 `/etc/kubernetes/*.conf`（admin.conf / super-admin.conf）。'
  - name: dest
    label: 目标文件
    type: str
    required: true
    pattern: '^/root/\.kube/[A-Za-z0-9._-]+$'
    default: /root/.kube/config
    help: '★ 白名单钉在 `/root/.kube/` 下 —— 它同时也是"目标文件**本来就存在**"的正确性前提（下面的 `cmp` 判据靠它）。'

precheck:
  - name: source_present
    title: 确认源文件在（★ 缺它必须中止 —— "集群还没建好"是**真故障**，不是"已达终态"）
    run: [ls, -l, "{{ source }}"]
    parser: raw
    timeout: 20
    note: >
      ★ 它**不声明** `means_done`：源文件不在说明**控制面还没建出来**，
      这时"跳过"会让后面的 `kubectl` 步骤给出一个更难懂的错误。

steps:
  - name: dest_before
    title: 目标文件现在与源一致吗（★ 幂等判据的"前"，`cmp` 的退出码就是结论）
    run: [cmp, -s, "{{ source }}", "{{ dest }}"]
    parser: raw
    ok_exit_codes: [0, 1, 2]
    timeout: 30
    note: >
      ★ 三个退出码**都是正常报告**：0 = 已经一致、1 = 不同、2 = 读不到（多半是目标不存在）。
      ★ 把它们都放进 `ok_exit_codes` 是**故意的**：目标不存在是**结论**（"第一次装"），
      不是"命令坏了"（§9.6 同族）。

  - name: mkdir
    title: 确保目标目录在（首次部署时它不存在）
    run: [mkdir, -p, /root/.kube]
    parser: raw
    ok_exit_codes: [0]
    timeout: 30

  - name: copy
    title: 装进去（`install -m 0600`：权限一次到位）
    run: [install, -m, "0600", "{{ source }}", "{{ dest }}"]
    parser: raw
    ok_exit_codes: [0]
    timeout: 30
    note: 输出为空是正常的（成功不打印）；★ 所以**不拿它做自证**（§9.6）。

  - name: same
    title: ★★ 自证：两个文件**逐字节相同**（`cmp -s` 退出码 0）
    run: [cmp, -s, "{{ source }}", "{{ dest }}"]
    # ★★ 解析器**必须是 `line_count` 而不是 `raw`** —— 这是本话题真跑抓到的一个**真缺陷**：
    #   `cmp -s` 成功时**什么都不输出** ⇒ `raw` 给 `None` ⇒ `verify` 的"有没有值"判定**必败**
    #   ⇒ 一条**假红**：所有步骤其实都跑成了，报告却说"自证未通过"。
    #   ★ 而 `line_count` 对空输出给 **0** —— **0 是一个值**，自证才判得下去。
    #   ★★ 与清单 80 是同一个坑的第 N 次现形：**不许拿"空输出即合法结论"的那一步去做非空断言**；
    #     这里还要补半句：**判据落在"退出码"上时，解析器必须选那个"能从空输出里读出值"的**。
    parser: line_count
    ok_exit_codes: [0]
    timeout: 30
    note: >
      ★ `ok_exit_codes: [0]` ⇒ 两个文件不同时是 **1**，那一步直接判 failed（不会滑到自证那一层）。
      ★ 自证的**值**是 **0 行** —— 0 是结论（"它们连一行差异都没有"），不是"没问到"。

verify:
  - name: ★★ 复制必须真的成立（判据是 `cmp`，不是"文件在不在"）
    from: same
    on_missing: >
      `cmp -s` 没能证明两个文件相同 —— 也就是说**入口没有真的装好**。
      ★ 这时 `kubectl` 会给出一个与"集群坏了"很像的错误；
      先看这一步，别去查集群（规范 §12.32.1 的"最容易误判"）。

conclusion: |
  【{host.name}】装入 kubeconfig（变更）
  · {source}  →  {dest}
  · ★★ 一致性判据（`cmp -s` 的退出码）：{same}（0 = 逐字节相同）
  · 装之前的一致性：{dest_before}（0 = 本来就一致 ⇒ 本次是幂等 / 1 = 不同 / 2 = 目标不存在）

  判读：
    · ★★ **判据是 `cmp`**：复制类操作的唯一硬判据是"两个文件逐字节相同"，
      不是"文件在不在"、也不是"`install` 返回 0"（规范 §12.32.2）；
    · ★ **装之前是 0** ⇒ 本次**没写盘**（幂等）；是 1 或 2 ⇒ 本次是真变更；
    · ★ **它不改集群**：只改**这一台机器上的一个文件**。若这一步失败，
      请先怀疑它自己（源文件在不在 / 目录可不可写），**不要去查集群**（规范 §12.32.1）；
    · ★ 权限固定 `0600`：这个文件带着**集群管理员凭据**；
    · **回退**：改动前的目标文件在**检查点**里（平台在写盘前自动备份），
      在「历史」里对这条任务点一次「恢复」即可；★ 原本不存在时，"恢复" = 把它删掉。
