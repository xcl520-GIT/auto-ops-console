# ============================================================
# 动作：受限删除（路径白名单）
# 来源：T5 配方引擎"卸载·全删"缺的那只手（规范 §12.8）
# 形态：删除**一个**受限路径 —— 先备份、再删、再用退出码自证没了
# 风险：red（★ 手输确认词 + 禁止批量）
# ============================================================

id: file.remove
title: 受限删除
summary: 删除一个配置文件或目录（只允许白名单内的路径形式；先备份、可恢复；禁止批量）
domain: C
risk: red
priority: P1
tags: [变更, 破坏性, 文件]

note: |
  ★ 为什么这个动作必须**受限**：
  T3 当时明确把 `rm` 推到后续，理由是"破坏性太强"。T5 的"卸载·全删"绕不过它，
  所以给它上了四道锁：
    ① 风险 red —— 手输确认词（服务端校验，点一下不算）；
    ② **路径白名单**（参数 `pattern`，安全契约第一层）：只允许
       /etc/<名>、/var/lib/<名>、/var/log/<名>、/opt/<名>、/var/www/<名> 这五种形式，
       且**每个路径段都不得以点开头** —— 于是 `/`、`/etc`、`/usr`、`/var`、
       以及**任何位置的 `..`** 全都在参数校验阶段就被拒绝（比"先规范化再校验"更严，
       因为根本没有路径能带着 `..` 走进来）；
    ③ **禁止批量**（引擎硬规矩，规范 §9.3）：一次只删一台；
    ④ 改动前**自动备份**（backup 段），失败即中止 —— 删不掉能撤回的，就别删。

  ★ `allow_large` 故意留空（默认 false）：目录超过 config.yaml 的 backup.max_file_mb 时
  **拒绝备份 → 整个动作不执行**。这是护栏，不是故障；真要删大目录，先去调那个阈值并想清楚。

confirm:
  title: 确认删除这个路径
  body: |
    即将在「{host.name}」（{host.address}）上**删除**：

      {path}

    会发生什么：该路径及其**全部内容**被删除（目录含子孙文件）。
    能撤回吗：可以 —— 本动作会**先把 {path} 备份**到目标机 /var/backups/aoc/ 下并回拉一份到管理机，
    之后可在「历史」页里对这条备份点一次「恢复」还原到原路径（恢复同样要手输确认词）。
    影响面：若这个目录正在被某个服务使用，删掉后该服务可能报错或起不来。

    ★ 请把上面这行路径再读一遍，确认它是你要删的东西。
  confirm_text: 我已确认要删除

params:
  - name: path
    label: 要删除的路径
    type: str
    required: true
    pattern: '^/(etc|var/lib|var/log|opt|var/www)/[A-Za-z0-9_@+][A-Za-z0-9._@+-]*(/[A-Za-z0-9_@+][A-Za-z0-9._@+-]*)*$'
    placeholder: /etc/nginx
    help: '只允许 /etc/<名>、/var/lib/<名>、/var/log/<名>、/opt/<名>、/var/www/<名> 形式；每段不得以点开头（于是 .. 一律被拒）'

backup:
  - path: "{{ path }}"
    label: "待删除的路径（删前的样子）"
    required: true
    note: required=true：要删的东西**本来就不存在**时，这是"无事可做"，应当中止而不是假装删过。

precheck:
  - name: before
    title: 确认它存在（★ 这一步的输出就是"确实有东西被删"的证据）
    run: [ls, -ld, "{{ path }}"]
    parser: raw
    timeout: 20
    note: 不存在时 rc=2 → 预检不通过 → 整条动作 aborted（目标机零改动、也不会白备份一次）。

steps:
  - name: size
    title: 记录删除前的体积
    run: [du, -sh, "{{ path }}"]
    parser: raw
    optional: true
    timeout: 60
    note: 目录给总字节。这一步失败不影响删除（大目录走 du 会慢，所以标 optional）。

  - name: remove
    title: 删除
    run: [rm, -rf, "{{ path }}"]
    parser: raw
    timeout: 120

  - name: gone
    title: 自证：它已经不存在（★ 退出码 2 就是结论）
    run: [ls, -ld, "{{ path }}"]
    parser: raw
    ok_exit_codes: [2]
    timeout: 20
    note: >
      ★ 规范 §9.6：证明"某物**不存在**"必须由**退出码**承担（ls 的 rc=2），
      不能写成 verify 的非空断言 —— 那会 100% 假失败。

verify:
  - name: 删除前该路径必须存在（它的输出就是"确实删掉了东西"的证据）
    from: before
    on_missing: 删除前的存在性检查没有输出 —— 这次删除不可信

conclusion: |
  【{host.name}】受限删除
  目标路径：{path}
  删除前：{before}
  删除前体积：{size}
  自证：它现在已经不存在（ls -ld 返回退出码 2，符合预期）
  ★ 本次删除已按护栏**先备份**：可在「历史」里对该备份一键恢复到原路径（恢复需手输确认词）。
