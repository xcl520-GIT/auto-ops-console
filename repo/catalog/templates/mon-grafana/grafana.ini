# ============================================================
# managed by auto-ops-console (T10) —— 请勿手工编辑
# 落点：/opt/aoc-monitoring/etc/grafana.ini
#
# ★★ 监听面（规范 v1.13 §12.53）：Grafana 的**官方默认是 `0.0.0.0:3000`**，
#    这里显式收到内网地址（`http_addr`），**永远不许出现 0.0.0.0**。
# ★★ 口令（红线 #2 / §12.58）：本文件里**没有任何口令**。
#    管理员口令走 **人在环** —— Grafana 11 首次登录 `admin/admin` 会**强制改密**，
#    这一步**只能人做**（报告里会明说），所以配方/模板里一个字都不写。
# ★ 渲染参数：bind_address / listen_port
# ============================================================

[server]
protocol = http
http_addr = {{ grafana_bind }}
http_port = {{ grafana_port }}
domain = {{ grafana_bind }}
enforce_domain = false
root_url = http://{{ grafana_bind }}:{{ grafana_port }}/

[paths]
data = /opt/aoc-monitoring/data/grafana
logs = /opt/aoc-monitoring/log/grafana
provisioning = /opt/aoc-monitoring/etc/grafana-provisioning
plugins = /opt/aoc-monitoring/grafana/plugins

[database]
type = sqlite3
path = /opt/aoc-monitoring/data/grafana/grafana.db

[security]
admin_user = admin
disable_gravatar = true
cookie_secure = false

[users]
allow_sign_up = false
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console file
level = info
