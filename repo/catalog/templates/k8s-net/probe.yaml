# ============================================================
# T8 · S7 跨节点连通性验证（三个对象，一次投递）
# ------------------------------------------------------------
# 目的：证明**跨节点的 Pod 到 Pod 真的通**（IPIP 隧道真的在工作）——
#       而不是"Calico 装上了、Pod 都 Running（假绿）"。
#
# ★★ 判据为什么能证伪（它落在**宿主机**上，由平台自己的手去读）：
#   ① headless Service + DaemonSet（busybox httpd）⇒ 每个节点上一个 Pod，各自监听 8080；
#   ② 一个 **Job**（钉在 node-01、挂同一个 local PV）从 **master01** 出发：
#      · 先让 **CoreDNS** 把 headless Service 解析成**各个 Pod 的 IP**；
#      · 再对每个 Pod IP 做 **HTTP 取一页** 与 **ping**；
#      · 把**逐条原文**写进 `/opt/aoc-k8s/pv01/crossnode.txt`（宿主机看得见的那份）。
#   ③ 平台随后用 `file.grep` 在宿主机上找 `hi from` 与 `bytes from` ——
#      ★ 只有**真的跨节点通了**才会出现这两样。
#      ★ 反过来说：若 `ipip` 没加载，这里的 HTTP/ping 会**失败**，
#        文件里留下的是 `HTTP FAILED` / `PING FAILED` —— **红得出来**。
#
# ★ 为什么用 headless（`clusterIP: None`）而不是普通 Service：
#   普通 Service 走的是 **kube-proxy 的 DNAT**（那是另一条链路）；
#   headless 直接给 **Pod IP** ⇒ 测的是**Pod↔Pod 的 Overlay 转发**，正是 IPIP 该管的那一段。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: aoc-net-probe
  namespace: default
  labels:
    app: aoc-net-probe
spec:
  clusterIP: None
  selector:
    app: aoc-net-probe
  ports:
    - name: web
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aoc-net-probe
  namespace: default
  labels:
    app: aoc-net-probe
spec:
  selector:
    matchLabels:
      app: aoc-net-probe
  template:
    metadata:
      labels:
        app: aoc-net-probe
    spec:
      # ★ 控制面带 NoSchedule 污点 ⇒ 不容忍它就上不了 master01（而"把三个节点都测到"是本验证的一半）
      tolerations:
        - operator: Exists
      containers:
        - name: web
          image: docker.io/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /www
              # ★ 标记里**不带空格**：平台的 `file.grep` 关键字白名单只收字母数字与 . _ @ + = : , / -
              #   （于是"用一句话去搜"这种用法天然被挡住 —— 那是"证据要能被逐字复核"的另一面）
              echo "aoc-netprobe-ok-from-$(hostname)" > /www/index.html
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          # ★ Ready 探针：headless Service 只登记 **Ready** 的 Pod ⇒
          #   没有它，Job 可能解析到一个还没起 httpd 的 IP（假红）
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aoc-net-check
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # ★ local 卷的 nodeAffinity 钉着 master01 ⇒ 这个 Job 只能在 master01 上跑
      nodeSelector:
        kubernetes.io/hostname: node-01
      tolerations:
        - operator: Exists
      containers:
        - name: check
          image: docker.io/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              OUT=/data/crossnode.txt
              : > "$OUT"
              echo "== 从 $(hostname) $(hostname -i) 出发 ==" >> "$OUT"
              i=0
              IPS=""
              while [ $i -lt 30 ]; do
                IPS=$(nslookup aoc-net-probe.default.svc.cluster.local 2>/dev/null \
                      | awk '{for (k=1;k<=NF;k++) if ($k ~ /^10\.244\./) print $k}')
                [ -n "$IPS" ] && break
                i=$((i+1)); sleep 2
              done
              echo "-- CoreDNS 解析到的 Pod IP（10.244/16 是 Pod 网段）--" >> "$OUT"
              echo "$IPS" >> "$OUT"
              for ip in $IPS; do
                echo "-- HTTP http://$ip:8080/ --" >> "$OUT"
                wget -q -O- -T 5 "http://$ip:8080/" >> "$OUT" 2>&1 || echo "HTTP FAILED $ip" >> "$OUT"
                echo "-- ping -c 2 $ip --" >> "$OUT"
                ping -c 2 -W 3 "$ip" >> "$OUT" 2>&1 || echo "PING FAILED $ip" >> "$OUT"
              done
              echo "== DONE ==" >> "$OUT"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aoc-local-pvc
