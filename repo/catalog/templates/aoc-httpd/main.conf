# ============================================================
# aoc-httpd 的站点配置（模板）—— 由配方「aoc-httpd」渲染到 /etc/httpd/conf.d/aoc.conf
# ------------------------------------------------------------
# ★ 这里就是"填空"填的东西：把骨架那份 `port = ...` 换成 **Apache 真正认的语法**。
# ★ RHEL 的 httpd.conf 末尾有 `IncludeOptional conf.d/*.conf`（server 配置上下文）
#   ⇒ `Listen` 与 `<VirtualHost>` 写在这里都会生效（真机确认过，见 T7·S5 证据）。
# ★ 模板里**没有"注释"这种东西**：说明文字里的裸 {{ }} 也会被当成占位符（规范 §12.4）。
# ============================================================

Listen {{ port }}

<VirtualHost *:{{ port }}>
    ServerName aoc-httpd.local
    DocumentRoot {{ root_dir }}

    <Directory {{ root_dir }}>
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog  /var/log/httpd/aoc-httpd-error.log
    CustomLog /var/log/httpd/aoc-httpd-access.log combined
</VirtualHost>
