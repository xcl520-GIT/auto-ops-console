# ============================================================
# 配方：MariaDB（T6 · 第二个阶段的第二个服务）
# ------------------------------------------------------------
# 一次点击 = 从"机器上什么都没有"到"数据库服务可用且有**真探活**健康检查"：
#   装 server + client → 渲染配置 → 启动 + 自启 → （配置变了才）重启 → 健康检查
# 反向操作：停止 / 卸载（保留数据）/ 卸载（全删）
#
# ★ 设计宪法（规范 §12.0）：
#   ① 本文件只声明"要什么"，**判定与分支一律走平台侧**（没有一处命令、没有一处表达式）
#   ② 「没变」可断言：平台采集 changed → **第二次跑该清单为空**就是幂等证明
#   ③ 每个正向步骤都有反向操作（见 uninstall）
# ============================================================

id: mariadb
name: MariaDB
version: "1"
summary: 一键部署 MariaDB（代 MySQL：模板渲染 + 配置校验 + 真探活健康检查 + 幂等重跑 + 可卸载）
risk: yellow

note: |
  ★ **为什么配方叫 `mariadb` 而不是 `mysql`**：
  Rocky/RHEL 10 里**没有 `mysql-server` 包**（T6 开题前实测 `dnf repoquery`）——
  可用的等价物是 `mariadb-server 3:10.11.18`。名字叫 mysql 的配方在这台机器上**一跑就是 400**。

  ★ **为什么本配方没有 preflight**（本话题唯一一个"没有预检"的配方）：
  照《新增一个服务需要做什么》的规矩，`preflight` 只放"**部署前后都成立**"的事实。
  Nginx 有 `absent(httpd)` 这种天然冲突项（Apache 会抢端口与站点目录）；
  MariaDB 在 Rocky 10 上**没有**等价物（`mysql-server` 这个包根本不存在，写它也永远为真）。
  ⇒ ★ **宁可不写，也不写一条永远为真的假闸门**。
  端口冲突不靠预检猜，靠 `svc.start` 之后**紧跟**健康检查、用**真实失败**暴露（与 nginx 同一姿势）。

  ★ **健康检查是"真问一句"，不是看单元在跑**：
  `responds: {action: db.mariadb-ping}` 走 `mariadb-admin ping`
  （本机 socket + unix_socket 认证，**不需要密码**）。这是 T6 新加的判据类型（规范 §12.11）：
  `state: active`（单元在跑）只是旁证，**服务自己答不答话**才是"可用"。

  ★ **配置只写我们自己的一个文件** `/etc/my.cnf.d/aoc.cnf`：
  不动包自带的那些 `.cnf`；反向操作也只删这一个文件 + 包目录留给「全删」（规范 §12.13）。

  ★ **首次启动要初始化数据目录** `/var/lib/mysql`：rpm 的 scriptlet **不建**它
  （实测 `dnf repoquery --scripts` 无相关输出），初始化发生在**首次 `svc.start`** 时，
  所以 `start` 步骤 timeout 放宽，且**紧跟着健康检查**（真实失败要暴露出来）。

params:
  - name: port
    label: 监听端口
    type: int
    required: true
    min: 1024
    max: 65535
    default: 3306
    help: '默认 3306。改端口后重跑一次配方即可：会写新配置并触发重启。'
  - name: bind
    label: 监听地址
    type: enum
    required: true
    choices: [仅本机, 所有网卡]
    values: ["127.0.0.1", "0.0.0.0"]
    default: 仅本机
    help: '默认只监听本机。★ 选「所有网卡」等于把这个库暴露到网络上，请想清楚再选。'
  - name: buffer_pool_mb
    label: InnoDB 缓冲池（MB）
    type: int
    required: true
    min: 64
    max: 1024
    default: 128
    help: '★ 小内存别调大：靶机只有 3.6G 内存，128M 足够。'
  - name: max_connections
    label: 最大连接数
    type: int
    required: true
    min: 10
    max: 500
    default: 100
    help: '演示环境 100 足够；真正上量前先看内存与连接池。'
  - name: charset
    label: 服务端字符集
    type: enum
    required: true
    choices: [utf8mb4（推荐）, utf8]
    values: [utf8mb4, utf8]
    default: utf8mb4（推荐）
    help: 'utf8mb4 支持 emoji 与四字节字符；utf8 是旧的「最多三字节」那个。'

steps:
  - name: install_server
    title: 安装 mariadb-server
    action: pkg.install
    args: { package: mariadb-server }

  - name: install_client
    title: 安装 mariadb 客户端
    action: pkg.install
    args: { package: mariadb }
    note: >
      ★ `mariadb-admin`（=`mysqladmin`）**不在 server 包里，在 client 包里**（实测确认）。
      一个小包换一道**真实判据** —— 没有它，健康检查就只能退回"看端口在不在听"。

  - name: render_conf
    title: 渲染服务端配置（/etc/my.cnf.d/aoc.cnf）
    template: mariadb/aoc.cnf
    dest: /etc/my.cnf.d/aoc.cnf
    mode: "0644"
    notify: [restart_mariadb]

  # ★ config_test 步骤待「§10.3 #2 真机验证配置校验命令」通过后加入（S2 内完成）：
  #   先把候选命令真机跑通 → 登记进 svc.configtest 的 cases（规范 §12.10）→ 再在配方里引用它。
  #   ★ 没验证过的命令不许写进枚举（写进去 = 多一道假闸门）。

  - name: config_test
    title: 校验配置语法（mariadbd --verbose --help）
    action: svc.configtest
    args: { binary: mariadbd }
    note: >
      ★ 这一段的命令是**真机验证过**才登记的（规范 §12.10 的登记纪律）：
      候选 A `mariadbd --validate-config` 在 MariaDB 10.11 上**不存在**（rc=1，当场被否）；
      候选 B `mariadbd --verbose --help` 真机 rc=0，且**写坏配置后会判失败**（正反例都跑过）。
      ★ 注意它的输出很大（约 190 KB）—— 本动作的结论只念"通过/失败"，不渲染原始输出（规范 §12.10）。

  - name: start
    title: 启动服务
    action: svc.start
    args: { unit: mariadb }
    note: >
      ★ 首次启动要初始化数据目录 `/var/lib/mysql`（rpm 的 scriptlet 不建它），可能比平时慢。
      这一步的**超时由动作自己的步骤超时决定**（配方不写 timeout —— 规范 §12.1.3 的键白名单里没有它），
      所以模板把缓冲池压到 128M：初始化越快、这一步越不容易踩超时。

  - name: enable
    title: 设为开机自启
    action: svc.enable
    args: { unit: mariadb }

  - name: restart_mariadb
    title: 重启 MariaDB（仅当配置真的变了）
    action: svc.restart
    args: { unit: mariadb }
    trigger_only: true
    note: '由 render_conf 的 notify 唤起；第二次跑（内容没变）**根本不会执行** —— 幂等靠这个成立。'

health:
  - expect:
      state: { unit: mariadb, equals: active }
  - expect:
      responds: { action: db.mariadb-ping, args: {} }
  # ★★ 为什么还要单独钉端口：`responds` 走的是**本机 socket**（免密码那条路），
  #    它证明"服务答话了"，但**完全不看 TCP 端口** —— 于是"参数里填的 port 到底生效没有"没人验。
  #    配置写错端口、或配置压根没被应用，光靠上面两条**照样全绿（假绿）**。
  #    `port_open` 是 `free_port` 的镜像（规范 §12.11 / 检查清单 45）。
  - expect:
      port_open: "{{ port }}"

uninstall:
  stop:
    - action: svc.stop
      args: { unit: mariadb }
  disable:
    - action: svc.disable
      args: { unit: mariadb }
  # ★ 只删**配方自己写出来的**那一个文件。
  #   包自带的 `/etc/my.cnf.d/*.cnf`（mariadb-server.cnf 等）一个都不许动 ——
  #   删了它们包就残缺，而重跑配方只能重写自己管的那个文件，修不回来（规范 §12.6 硬规矩 1）。
  remove_config:
    - action: file.remove
      args: { path: /etc/my.cnf.d/aoc.cnf }
  # ★ 数据 + 包自带的配置目录：只在「全删」时删（那时包也会被卸，目录随之由 rpm 收走）
  purge_paths:
    - /var/lib/mysql
    - /etc/my.cnf.d
  # ★ 「保留数据」是一条**承诺**，报告里必须念出来，而且要被真验（规范 §12.13.1）
  keep_data:
    - /var/lib/mysql
  remove_packages:
    - mariadb-server
    - mariadb
  stop_confirm_text: 我已确认要停止服务
  purge_confirm_text: 我已确认全删
  # ★ 停止 / 「保留数据」卸载**之后**应当成立的事实（规范 §12.6.3）：
  #   ★★ 用**端口没人听**这种"外部可观测"判据，**不用** `state: {equals: inactive}` ——
  #     后者依赖"单元还驻留在 systemd 内存里"，`svc.disable` 之后它会从内存卸载（T5 真跑踩过）。
  health:
    - expect:
        free_port: "{{ port }}"
