# ============================================================
# 配方：监控采集器（node_exporter · T10）
# ------------------------------------------------------------
# 一次点击 = 在**任意一台**靶机上铺采集器：传包 → 解包 → 渲染 unit → 起服务 → 健康检查
#
# ★ 它与 `monitoring-stack` 的关系：
#   `monitoring-stack` 负责"装机 + 本机采集器"；本配方负责"**把其余几台也纳进来**"。
#   两台机器各跑一次同一条配方 = 四台都有 `health=up` 的 target（验收 #3）。
#
# ★ 为什么拆成两份配方而不是一份带 `run_by`：
#   ① 它们**装的东西不一样**（一个装三件套，一个只装采集器）；
#   ② 记账口径仍然是**一条**（`platform: monitoring-stack`）—— 判据是"用户能不能不看终端做完一件事"，
#      "接入监控告警"是**一件**；配套的采集器配方是同一件事的执行面，不再单独立账。
#
# ★ 设计宪法（规范 §12.0）：只声明"要什么" / 幂等可断言 / 每个正向步骤都有反向操作。
# ============================================================

id: monitoring-agent
name: 监控采集器（node_exporter）
version: "1"
summary: 在一台靶机上铺 node_exporter（只加一个二进制 + 一个 unit + 一个端口），并用端口判据自证
risk: yellow

note: |
  ★★ **为什么与三件套分开**：本配方只做"采集器"这一件事，装在**每一台**被监控的机器上；
    而三件套只装在**一台**上。混在一份配方里会让"在某台机器上装错了东西"变得可能。
  ★★ **监听面（§12.53）**：`--web.listen-address=<listen_ip>:9100` ——
    必须绑**能被 Prometheus 抓到的内网地址**，但**绝不许是 0.0.0.0**。
    ★ 这也是本配方把 `listen_ip` 做成**必填**的原因：**没有默认值能同时适配四台机器**，
    给一个默认值只会让另外三台装出一个"绑不上的单元"（那是**假成功**的温床）。
  ★★ **本配方在 docker-01 上只加三样东西**：一个二进制、一个 unit、一个端口 ——
    **不碰 Harbor 容器、不改它的端口、不重启它**（红线 #1）。
  ★ **回不去**：`/opt/aoc-monitoring/data` 里没有本配方的东西（采集器不落数据），
    所以它的"回不去"**只有一样**：**已经抓进 Prometheus 的历史样本**（在下游，不在本机）。

params:
  - name: ne_ip
    label: 本机内网地址（采集器绑它）
    type: str
    required: true
    default: 192.0.2.11
    pattern: '^(10|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}$'
    help: ★ 装哪台就填哪台的内网地址，写错了会当场起不来（而不是静默绑到 0.0.0.0）。
  - name: ne_port
    label: 采集端口
    type: int
    required: true
    min: 1024
    max: 65535
    default: 9100
    help: '默认 9100。★ 改它的话，Prometheus 那边的 targets 文件也要跟着改（两处不一致 ⇒ 目标会 down）。'
  - name: target_name
    label: 这台机器在监控里的名字
    type: str
    required: true
    default: aoc-mon-agent
    pattern: '^aoc-mon-[a-z0-9][a-z0-9-]{1,32}$'
    help: ★ 必须以 `aoc-mon-` 开头 —— 与"注册抓取目标"那条扩展点同一套命名纪律。

steps:
  - name: unpack
    title: 上传并解包 node_exporter
    action: mon.unpack
    args: { artifact: node_exporter-1.12.1.linux-amd64.tar.gz, dest: node_exporter-1.12.1, component: node_exporter }
    note: ★ 上传也在这一步里（`mon.unpack` 的 `stage` 步）—— 不用 `file.push` 的理由见那条注释。

  - name: render_unit
    title: 渲染 aoc-node-exporter.service（监听面收窄 + textfile 采集目录）
    template: mon-node-exporter/node_exporter.service
    dest: /etc/systemd/system/aoc-node-exporter.service
    mode: "0644"
    notify: [daemon_reload]

  - name: daemon_reload
    title: 重读 systemd 单元定义（仅当单元文件真的变了）
    action: svc.daemon-reload
    args: { unit: aoc-node-exporter.service }
    trigger_only: true

  - name: start
    title: 启动采集器
    action: svc.start
    args: { unit: aoc-node-exporter.service }
    notify: [enable]

  - name: enable
    title: 开机自启
    action: svc.enable
    args: { unit: aoc-node-exporter.service }
    trigger_only: true

  - name: clear_stale_metric
    title: 清掉可能残留的人造指标（幂等：本来没有就跳过）
    action: mon.selftest-metric
    args: { value: 0, target: aoc-mon-selftest }
    note: >
      ★ 这一条是为了让"新铺的采集器"从一个**已知状态**开始：
      如果这台机器上曾经造过告警条件（写了 textfile 指标），把它归零，免得**上一轮的靶子**跟着进来。
      ★ 值 0 不是删除、只是让规则 `>= 1` 不成立；真正收干净见 §12.44 的"收完自己验"。

health:
  - expect:
      state: { unit: aoc-node-exporter.service, equals: active }
  # ★★ 端口判据（而不是"单元 active"）—— T6 的教训：状态是旁证，端口才是"外部可观测"。
  - expect:
      port_open: "{{ ne_port }}"

uninstall:
  stop:
    - action: svc.stop
      args: { unit: aoc-node-exporter.service }
  disable:
    - action: svc.disable
      args: { unit: aoc-node-exporter.service }
  remove_config:
    - action: file.remove
      args: { path: /etc/systemd/system/aoc-node-exporter.service }
  purge_paths:
    - /opt/aoc-monitoring
  # ★ 「保留数据」必须显式承诺（§12.13.1）。★ 说清一件事：**采集器自己不落数据** ——
  #   下面这一条是**共享目录**（同一台上若还跑着别的监控组件，时序数据在 data/prometheus 里）。
  #   承诺"保留数据"模式下它一个字节都不动 —— ★ **空也要写"无"**，但这里不是"无"，是"有且不动"。
  keep_data:
    - /opt/aoc-monitoring/data
  stop_confirm_text: 我已确认要停止这台机器的采集器
  purge_confirm_text: 我已确认全删这台机器的采集器
  health:
    - expect:
        free_port: "{{ ne_port }}"
