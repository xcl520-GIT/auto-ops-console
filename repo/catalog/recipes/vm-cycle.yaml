# ============================================================
# 配方：虚拟机循环（开机 → 等就绪 → 等 SSH → 体检 →（可选）关回）· T16
# ------------------------------------------------------------
# ★★ **本项目的编排链第一次真的跨两个执行面**（规范 §12.115）：
#     · `vm.start` / `vm.wait-guest` / `vm.stop` 走**本机通道**（宿主机上的 vmrun.exe，不走 ssh）；
#     · `wait`（等 SSH）与 `host.checkup` 走 **ssh 通道**（真的从管理机连过去）。
#     它们的目标机是**同一台** ⇒ "意图面"是这台 VM，"执行面"里前几个动作是宿主机。
#     ★ 两处都真，报告里不合并（§12.115 规矩 2）。
#
# ★★ 四级判据各归各家（§12.117）—— 不许把它们混成一句"开机成功"：
#     ① `vm.start`       ：VMware **收下了**请求 ⇒ 再问一次它**认为**它在跑吗；
#     ② `vm.wait-guest`  ：guest 真的起来了（VMware Tools 报出地址）；
#     ③ **`wait`（本步骤）**：**SSH 端口真的开了** —— ★ "能 ssh 进去"的判据；
#     ④ `host.checkup`   ：**真的 ssh 进去**查一遍（能连上 ≠ 查得通，这一步连上再查）。
#
# ★★ `wait` 步骤是**兑现一个早就写下的承诺**（规范 §12.120）：
#     本项目的配方引擎一直把 `wait` 放在 `STEP_KEYS` 里，注释写着「预留给 T16 的
#     「开机 → 等就绪」」—— 本话题把它实现了。★ 它等的是**条件**，不是**时间**。
#
# ★★ 设计宪法（规范 §12.0）：只声明"要什么" / 幂等可断言 / 每个正向步骤都有反向操作。
# ============================================================

id: vm-cycle
name: 虚拟机循环（开机 → 等就绪 → 等 SSH → 体检 →（可选）关回）
version: "1"
summary: 把一台关机的靶子机开起来、等它真的就绪、等 SSH 通、做一次体检；勾了「关回」再关回去
risk: yellow

note: |
  ★★ **「关回」是一个显式开关，不是默认行为**（红线 16 的镜像纪律）：
    `power_off` 留空 ⇒ **保持开机** —— 因为"我只是想看体检"的人**不该**被顺手关掉机器。
    这就是本配方把它做成 `when` 条件步骤、而不是直接排进步骤表的原因。
  ★★ **四级判据各归各家**（§12.117）：见页首注释。★ 任何一级失败都**如实红**。
  ★ **幂等**：机器已经开着时 `vm.start` 报 `changed=false`（"本来就开着，本次什么都没改"）；
    关回那一步同理。★ 判据来自**动手前那条探针**读到的状态，不是"命令没报错"。
  ★ **回不去**（逐项说清，没有也写「无」）：
    · 无。开机能关回、关机能再开；★ 唯一的代价是**时间**与**宿主机资源**（CPU / 内存 / 磁盘 IO）。
  ★★ 参数 `vm` **必须与上面选的目标机是同一台**（本环境：`hosts.yaml` 里的主机 id 就是 VM 名）。
    选错了会怎样：开机与等就绪都成功，而 `wait`（等 SSH）与 `host.checkup` 会去连**那台没起来**的机器 ⇒
    **如实红**（不会静默通过），报告里能一眼看出"开的是哪台、查的是哪台"。

# ★★ 本配方**没有卸载**：它不装包、不写配置、不动数据 —— 它只按开关机。
#    ★ 按"服务类配方硬规则"（§12.6）硬填一份 uninstall（撤自启 / 删配置 / 全删路径）
#      等于**编一份假的清单**，那正是"报告不许说假话"的反面。
#    ★ 所以走显式开口：**声明 ＋ 写明理由**（裸开关会被装载器当场拒掉）。
no_uninstall: true
no_uninstall_why: |
  本配方**不安装任何东西** —— 它只做一件事：把一台虚拟机开起来、确认它可用、再按需关回去。
  ★ 没有可停的服务（`vm.stop` 已在正向步骤里按开关执行）、没有可撤的开机自启、没有可删的路径，
  也没有"全删"这回事（删虚拟机磁盘是另一件事，且属 T17/更危险的那一类）。
  ★ 反向操作 = **关回去**：由正向步骤里的 `power_off` 开关承担；
    事后想再关一次，用动作 `vm.stop`（yellow）或界面上的一次点击即可。

params:
  - name: vm
    label: 虚拟机（★ 必须与上面选的目标机是同一台）
    type: str
    required: true
    default: node-03
    placeholder: node-03 或 vm-docker-01.vmx
    help: 填 hosts.yaml 里的主机 id（推荐）或 vmx 文件名；★ 只有"已登记"或"当次点名"的才允许操作（红线 12）

  - name: timeout_sec
    label: 最多等多少秒（等 guest 就绪 / 等 SSH / 关机完成）
    type: int
    required: true
    default: 180
    min: 10
    max: 900
    help: 等不到 ⇒ 判红（★ 「等不到」是一条结论，不是"大概好了"）

  - name: power_off
    label: 用完关回去（可选）
    type: enum
    required: false
    choices: ["保持开机", "关回去（soft 优雅关机）"]
    values: ["", "soft"]
    default: ""
    help: '留空（保持开机）或选 soft（体检完优雅关机回去）。★ 拔电源（hard）请到动作页用 vm.stop-hard —— 那是 red，要手输确认词、且禁批量'

steps:
  - name: power_on
    title: 开机（★ 收条 + 再问一次 VMware"它真的在跑吗"）
    action: vm.start
    args: { vm: "{{ vm }}", timeout_sec: "{{ timeout_sec }}" }
    note: ★ 已经在跑也不报错 —— 那一步是**幂等**的（`changed=false`），且只有**探针**能判出这一点。

  - name: wait_guest
    title: 等 guest 就绪（★ "起来了" —— 但它 ≠ "能 ssh 进去"）
    action: vm.wait-guest
    args: { vm: "{{ vm }}", timeout_sec: "{{ timeout_sec }}" }

  - name: wait_ssh
    title: 等 SSH 就绪（★ "能 ssh 进去"的判据 —— 端口真的开了才算）
    wait:
      expect: { port_open: "22" }
      timeout_sec: 180
      interval_sec: 5
      fail_reason: |
        guest 起来了但 SSH 端口还没开：可能是 sshd 还在起、防火墙还没放行、或者地址变了。
        ★ 先看 `vm.wait-guest` 那一步拿到的地址对不对 —— 「起来了」与「连得上」是两件事。
    note: |
      ★★ 这是 `wait` 步骤（规范 §12.120）：**轮询条件，不是睡时间** ——
        机器起得快就立刻往下走，到点还没通就**判红**。
      ★ 判据选的是 `port_open`（一次 TCP 连接，**不产生任何任务**）——
        若这里改用 `state` / `responds`，每一轮轮询都会真的起一个只读动作 = 制造噪音。

  - name: checkup
    title: 一键体检（★ 这一步**真的 ssh 进去**查 —— "连得上"之后才是"查得通"）
    action: host.checkup

  - name: power_off
    title: 关回去（可选 · soft 优雅关机）
    action: vm.stop
    args: { vm: "{{ vm }}", timeout_sec: "{{ timeout_sec }}" }
    when: power_off
    note: |
      ★ `when: power_off` = **只有那个人填了值才跑**（配方参数名要写裸名，不写 {{ }}）。
      ★ 这就是"可选关回"的落点：不做成无条件步骤，是为了**不把关机变成默认行为**。

health:
  # ★★ 本配方的健康检查回答的正是「**能 ssh 进去、且查得通**」（§12.117 的第 3/4 级）：
  #    前两级（VMware 认为在跑 / guest 报出地址）由动作自己断言；这里问的是**登录通道**。
  - expect:
      state: { unit: sshd.service, equals: active }
  - expect:
      port_open: "22"
